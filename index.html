<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167x167.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120x120.png">
  <link rel="manifest" href="/icons/site.webmanifest">
  <meta name="msapplication-TileImage" content="/icons/mstile-150x150.png">
  <meta name="msapplication-TileColor" content="#0A0A0F">
  <meta name="msapplication-config" content="/icons/browserconfig.xml">
  <meta name="theme-color" content="#0A0A0F">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>DMFlow – Instagram DM Automation for Creators & Brands</title>
  <meta name="description" content="Auto-reply to Instagram comments, send DMs with links, and capture leads. Join 14,000+ creators using DMFlow. Trusted Meta Tech Provider.">
  <meta property="og:title" content="DMFlow – Instagram DM Automation">
  <meta property="og:description" content="Turn comments into customers automatically. Trusted by 14,000+ Instagram creators.">
  <meta property="og:image" content="https://dmflowapp.in/icons/android-chrome-512x512.png">
  <meta property="og:url" content="https://dmflowapp.in/">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://dmflowapp.in/">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Global CSS -->
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <!-- ===== ALL SECTIONS LOADED HERE ===== -->
  <div id="app">
    <div id="section-nav"></div>
    <div id="section-announcement"></div>
    <div id="section-hero"></div>
    <div id="section-logos"></div>
    <div id="section-meta-showcase"></div>
    <div id="section-stats-proof"></div>
    <div id="section-how-it-works"></div>
    <div id="section-use-cases"></div>
    <div id="section-pricing"></div>
    <div id="section-faq"></div>
    <div id="section-creators-wall"></div>
    <div id="section-price-compare"></div>
    <div id="section-shadowban"></div>
    <div id="section-device-showcase"></div>
    <div id="section-testimonials"></div>
    <div id="section-cta"></div>
    <div id="section-contact"></div>
    <div id="section-footer"></div>
  </div>

  <!-- ===== LOAD SECTIONS ===== -->
  <script>
    const sections = [
      { id: 'nav', file: '01-nav.html' },
      { id: 'announcement', file: '02-announcement.html' },
      { id: 'hero', file: '03-hero.html' },
      { id: 'logos', file: '04-logos.html' },
      { id: 'meta-showcase', file: '05-meta-showcase.html' },
      { id: 'stats-proof', file: '06-stats-proof.html' },
      { id: 'how-it-works', file: '07-how-it-works.html' },
      { id: 'use-cases', file: '08-use-cases.html' },
      { id: 'pricing', file: '09-pricing.html' },
      { id: 'faq', file: '10-faq.html' },
      { id: 'creators-wall', file: '11-creators-wall.html' },
      { id: 'price-compare', file: '12-price-compare.html' },
      { id: 'shadowban', file: '13-shadowban.html' },
      { id: 'device-showcase', file: '14-device-showcase.html' },
      { id: 'testimonials', file: '15-testimonials.html' },
      { id: 'cta', file: '16-cta.html' },
      { id: 'contact', file: '17-contact.html' },
      { id: 'footer', file: '18-footer.html' }
    ];

    // Load sections in order, then run any inline <script> tags inside them
    async function loadSections() {
      for (const s of sections) {
        try {
          const res = await fetch(`sections/${s.file}`);
          if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
          const html = await res.text();
          const target = document.getElementById(`section-${s.id}`);
          target.innerHTML = html;

          // Re-execute any <script> tags that came inside the fetched section
          target.querySelectorAll('script').forEach(oldScript => {
            const newScript = document.createElement('script');
            if (oldScript.src) {
              newScript.src = oldScript.src;
            } else {
              newScript.textContent = oldScript.textContent;
            }
            oldScript.replaceWith(newScript);
          });
        } catch (err) {
          console.error(`Failed to load ${s.file}:`, err);
        }
      }
      document.dispatchEvent(new Event('sectionsLoaded'));
    }

    loadSections();
  </script>

  <!-- Global JS -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
