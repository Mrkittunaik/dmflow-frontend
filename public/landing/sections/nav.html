<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMFlow Section Preview: Nav</title>
<!-- base href resolves every relative path here as if this file lived at the
     project root — needed since this file actually sits in landing/sections/ -->
<base href="../../../">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="public/assets/styles/main.css">
<link rel="stylesheet" href="public/landing/styles/shared.css">
<link rel="stylesheet" href="public/landing/styles/nav.css">

      DM<span>Flow</span>
    </a>
    <ul class="nav-links">
      <li><a href="#features">Features</a></li>
      <li><a href="#templates">Templates</a></li>
      <li><a href="#pricing">Pricing</a></li>
      <li><a href="#faq">FAQ</a></li>
      <li><a href="/app/marketing/careers.html">Careers</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <div class="nav-right">

      <a href="/app/auth/register.html" class="btn-primary" id="navRegisterBtn">Start free →</a>

<div class="nav-mobile-drawer" id="mobileDrawer">

    <button onclick="closeMobileNav()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#0A0A0F;padding:4px 8px;">✕</button>
  </div>
  <div class="mob-divider"></div>
  <a href="#features" onclick="closeMobileNav()">Features</a>
  <a href="#templates" onclick="closeMobileNav()">Templates</a>
  <a href="#pricing" onclick="closeMobileNav()">Pricing</a>
  <a href="#faq" onclick="closeMobileNav()">FAQ</a>
  <a href="/app/marketing/careers.html" onclick="closeMobileNav()">Careers</a>
  <a href="#contact" onclick="closeMobileNav()">Contact</a>

  <a href="/app/auth/register.html" class="mob-cta" id="mobRegisterLink">Start free →</a>
