<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
 <meta name="dmflow-api" content="https://dmflow-backend-u9h8.onrender.com">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DMFlow</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Instrument Sans',sans-serif;background:#F4F4F8;color:#0A0A0F;-webkit-font-smoothing:antialiased;}

/* ── SHELL ── */
.shell{display:flex;height:100vh;overflow:hidden;}

/* ── SIDEBAR ── */
.sidebar{
  width:228px;min-width:228px;
  background:linear-gradient(180deg,#fafaff 0%,#f5f5fc 60%,#f0f0f8 100%);
  border-right:1px solid #E2E2EA;
  display:flex;flex-direction:column;
  height:100vh;overflow:hidden;
  flex-shrink:0;
  position:relative;
  z-index:10;
}

/* Logo */
.sb-logo{padding:18px 20px 14px;border-bottom:1px solid #E2E2EA;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.sb-logo a{font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:800;color:#0A0A0F;text-decoration:none;}
.sb-logo a span{color:#7C3AED;}

/* User block */
.sb-user{padding:10px 14px;border-bottom:1px solid #F0F0F5;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.sb-av{width:34px;height:34px;border-radius:10px;background:#7C3AED;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;overflow:hidden;transition:background .3s;}
.sb-user-name{font-size:13px;font-weight:700;color:#0A0A0F;line-height:1.2;}
.sb-user-plan{font-size:11px;color:#9898A8;}

/* IG badge — hidden/removed per design update */
.sb-ig-badge{display:none !important;}
.sb-ig-dot{display:none;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sb-ig-name{font-size:12px;font-weight:700;color:#166534;}
.sb-ig-sub{font-size:10px;color:#4ADE80;}

/* ── AVATAR ADVANCED STATES ── */
/* Shimmer skeleton while image is loading */
.sb-av.av-loading{background:linear-gradient(90deg,#E2E2EA 25%,#EBEBF0 50%,#E2E2EA 75%);background-size:200% 100%;animation:avShimmer 1.4s ease infinite;}
.mob-av.av-loading{background:linear-gradient(90deg,#E2E2EA 25%,#EBEBF0 50%,#E2E2EA 75%);background-size:200% 100%;animation:avShimmer 1.4s ease infinite;}
@keyframes avShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Fade-in for avatar image once loaded */
.sb-av img,.mob-av img{
  width:100%;height:100%;object-fit:cover;border-radius:inherit;
  opacity:0;transition:opacity .35s ease;
}
.sb-av img.av-ready,.mob-av img.av-ready{opacity:1;}

/* Profile pic support */
.sb-av img{border-radius:10px;}
.mob-av img{border-radius:8px;}

/* New Automation btn — clean frosted white glass */
.sb-new{
  margin:12px 14px 4px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 14px;
  background:rgba(255,255,255,0.55);
  color:#0A0A0F;
  border-radius:12px;
  font-size:13px;font-weight:700;
  text-decoration:none;
  transition:all .2s;
  flex-shrink:0;cursor:pointer;
  border:1.5px solid rgba(255,255,255,0.95);
  box-shadow:0 2px 16px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  position:relative;
  overflow:hidden;
}
.sb-new::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(255,255,255,0.45) 0%,rgba(255,255,255,0.10) 100%);
  pointer-events:none;
}
.sb-new:hover{
  background:rgba(255,255,255,0.82);
  box-shadow:0 4px 22px rgba(0,0,0,0.10),inset 0 1px 0 rgba(255,255,255,1);
  transform:translateY(-1px);
}
.sb-new svg{position:relative;z-index:1;}
.sb-new span,
.sb-new{position:relative;z-index:1;}

/* Nav */
.sb-nav{padding:6px 10px;flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;}
.sb-nav::-webkit-scrollbar{width:3px;}
.sb-nav::-webkit-scrollbar-thumb{background:#E2E2EA;border-radius:2px;}

.sb-link{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:500;color:#2A2A3A;text-decoration:none;transition:background .15s,color .15s;cursor:pointer;user-select:none;white-space:nowrap;border:none;background:none;width:100%;font-family:inherit;}
.sb-link:hover{background:#EBEBF0;color:#0A0A0F;}
.sb-link.active{background:#0A0A0F!important;color:#fff!important;font-weight:700!important;border:none!important;box-shadow:none!important;}
.sb-link.active svg{opacity:1!important;stroke:#fff!important;color:#fff!important;}
.sb-link.active .sb-soon{display:none;}
.sb-link svg{flex-shrink:0;opacity:.7;}

.sb-section{font-size:10px;font-weight:800;color:#888;letter-spacing:.8px;padding:6px 12px 2px;text-transform:uppercase;}
.sb-divider{height:1px;background:#F0F0F5;margin:6px 10px;}
.sb-disabled{opacity:.4;cursor:not-allowed;pointer-events:none;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:500;color:#2A2A3A;}
.sb-disabled svg{flex-shrink:0;opacity:.5;}
.sb-soon{margin-left:auto;font-size:9px;font-weight:700;background:#F0F0F5;color:#9898A8;padding:2px 7px;border-radius:10px;}

/* Bottom stats */
.sb-bottom{padding:12px 14px;border-top:1px solid #F0F0F5;flex-shrink:0;}
.sb-stat{margin-bottom:8px;}
.sb-stat-label{font-size:11px;color:#9898A8;display:flex;justify-content:space-between;margin-bottom:3px;}
.sb-stat-label span{font-weight:700;color:#0A0A0F;}
.sb-bar{height:3px;background:#E2E2EA;border-radius:2px;}
.sb-fill{height:3px;background:#C8FF00;border-radius:2px;transition:width .4s;}
.sb-upgrade{width:100%;padding:9px;background:#0A0A0F;color:#fff;border:none;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s;}
.sb-upgrade:hover{background:#2A2A3A;}

/* ── CONTENT IFRAME ── */
.content-area{flex:1;height:100vh;overflow:hidden;position:relative;}
#contentFrame{width:100%;height:100%;border:none;display:block;background:#F4F4F8;transition:opacity .18s ease;}
#contentFrame.loading{opacity:0;}

/* ── MOBILE TOPBAR ── */
.mob-topbar{
  display:none;align-items:center;justify-content:space-between;
  height:48px;background:#fff;border-bottom:1px solid #E2E2EA;
  position:fixed;top:0;left:0;right:0;z-index:50;
  padding:0 16px;
}
.mob-logo-wrap{display:flex;align-items:center;gap:8px;}
.mob-logo-icon{width:28px;height:28px;background:#0A0A0F;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mob-logo-icon svg path{fill:#C8FF00;}
.mob-logo-text{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:800;color:#0A0A0F;letter-spacing:-.3px;}
.mob-logo-text span{color:#7C3AED;}
.mob-topbar-right{display:flex;align-items:center;gap:8px;}
.mob-av{width:28px;height:28px;border-radius:8px;background:#7C3AED;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;overflow:hidden;transition:background .3s;}

/* ── BOTTOM NAV ── */
.bottom-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:#fff;border-top:1px solid #E2E2EA;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  height:calc(62px + env(safe-area-inset-bottom));
  align-items:flex-start;justify-content:space-around;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.bn-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:4px 6px;cursor:pointer;border:none;background:none;
  font-family:inherit;flex:1;min-width:0;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1);
  -webkit-tap-highlight-color:transparent;
}
.bn-item:active{transform:scale(.88);}
.bn-item svg{opacity:.4;transition:opacity .2s,transform .2s cubic-bezier(.34,1.56,.64,1);}
.bn-item span{font-size:9px;font-weight:600;color:#9898A8;transition:color .2s;white-space:nowrap;}
.bn-item.active svg{opacity:1;transform:scale(1.12);}
.bn-item.active span{color:#7C3AED;font-weight:800;}
.bn-item.active svg *{stroke:#7C3AED !important;}
/* Plus button */
.bn-plus{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;border:none;background:none;font-family:inherit;flex:1;
  -webkit-tap-highlight-color:transparent;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1);
}
.bn-plus:active{transform:scale(.88);}
.bn-plus-circle{
  width:42px;height:42px;background:#0A0A0F;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.22);margin-top:-10px;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;
}
.bn-plus:active .bn-plus-circle{transform:scale(.9);box-shadow:0 2px 8px rgba(0,0,0,.18);}
.bn-plus span{font-size:9px;font-weight:600;color:#9898A8;}
/* More button */
.bn-more{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:4px 6px;cursor:pointer;border:none;background:none;font-family:inherit;flex:1;
  -webkit-tap-highlight-color:transparent;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1);
}
.bn-more:active{transform:scale(.88);}
.bn-more svg{opacity:.4;transition:opacity .2s,transform .2s;}
.bn-more span{font-size:9px;font-weight:600;color:#9898A8;transition:color .2s;}
.bn-more.active svg{opacity:1;transform:scale(1.12);}
.bn-more.active span{color:#7C3AED;font-weight:800;}

/* ── MORE POPUP CARD ── */
.more-popup{
  display:none;position:fixed;
  bottom:calc(62px + env(safe-area-inset-bottom) + 10px);
  left:50%;transform:translateX(-50%) translateY(8px);
  width:calc(100% - 28px);max-width:360px;
  background:#fff;border-radius:22px;
  box-shadow:0 8px 48px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.05);
  z-index:300;padding:6px 0;overflow:hidden;
  opacity:0;
  transition:opacity .22s ease,transform .22s cubic-bezier(.34,1.4,.64,1);
}
.more-popup.show{
  display:block;opacity:1;
  transform:translateX(-50%) translateY(0);
  animation:popUp .22s cubic-bezier(.34,1.4,.64,1) forwards;
}
@keyframes popUp{
  from{opacity:0;transform:translateX(-50%) translateY(14px);}
  to{opacity:1;transform:translateX(-50%) translateY(0);}
}
.more-popup-item{
  display:flex;align-items:center;gap:14px;padding:12px 20px;
  cursor:pointer;transition:background .12s;
  -webkit-tap-highlight-color:transparent;
}
.more-popup-item:active{background:#F4F4F8;}
.more-popup-item:hover{background:#F8F8FC;}
.more-popup-item svg{opacity:.6;flex-shrink:0;}
.more-popup-item span{font-size:14px;font-weight:600;color:#0A0A0F;}
.more-popup-item.active-item span{color:#7C3AED;font-weight:800;}
.more-popup-item.active-item svg{opacity:1;}
.more-popup-item.active-item svg *{stroke:#7C3AED !important;}
.more-popup-divider{height:1px;background:#F4F4F8;margin:3px 0;}
.more-popup-overlay{display:none;position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.04);}
.more-popup-overlay.show{display:block;}

/* ── SIDEBAR OVERLAY (keep for desktop compat) ── */
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99;}

/* Logo mark for mobile (hidden on desktop) */
.sb-logo-mark{
  display:none;
  width:28px;height:28px;background:#0A0A0F;border-radius:7px;
  align-items:center;justify-content:center;
}
.sb-logo-mark svg path{fill:#C8FF00;}

@media(max-width:900px){
  .mob-topbar{display:flex;}
  .content-area{padding-top:48px;padding-bottom:calc(62px + env(safe-area-inset-bottom));}
  #contentFrame{height:100%;}
  .sidebar{display:none !important;}
  .bottom-nav{display:flex;}
}
</style>
</head>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script>
(function () {
  // ── Login gate ──
  const _u = localStorage.getItem('dmflow_user');
  const _t = localStorage.getItem('dmflow_token');
  if (!_u || _u === 'null' || !_t) {
    window.location.replace('pages/auth/login.html');
    return;
  }

  // ── Avatar system constants ──
  // Instagram CDN profile_picture_url expires ~24-48h.
  // We proactively refresh after 20h so the URL never goes stale visually.
  const AVATAR_TTL_MS    = 20 * 60 * 60 * 1000; // 20 hours
  const AVATAR_TS_KEY    = 'dmflow_avatar_ts';
  const AVATAR_MAX_RETRY = 2;

  // ── Load user info ──
  function loadUserInfo() {
    try {
      const user     = JSON.parse(localStorage.getItem('dmflow_user') || '{}');
      const name     = user.name || user.displayName || 'User';
      const plan     = user.plan || 'Free';
      const ig       = user.instagram || {};
      const igUser   = ig.username || user.instagramUsername || user.igUsername || '';
      const igPic    = ig.profilePic || user.igProfilePic || '';
      const dmsSent  = user.dmsSent  || 0;
      const dmsLimit = user.dmsLimit || 500;
      const igLimit  = user.igLimit  || 1;
      const igCount  = igUser ? 1 : 0;
      const q = id => document.getElementById(id);

      const avEl    = q('sbAv');
      const mobAvEl = q('mobAv');
      const avatarLetter = igUser ? igUser.charAt(0).toUpperCase() : name.charAt(0).toUpperCase();
      const avatarBg = igUser
        ? 'linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)'
        : '#7C3AED';

      // ── Core: render image into an avatar element ──
      // Shows shimmer → fade-in image on load → fallback on error
      function renderAvatarImg(el, url, radius, retryCount) {
        if (!el || !url) return;
        retryCount = retryCount || 0;

        el.innerHTML = '';
        el.classList.add('av-loading');
        el.style.background = '';
        el.style.padding = '0';

        const img = document.createElement('img');
        img.alt = 'profile';
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:' + radius + ';display:block;';

        img.onload = function() {
          el.classList.remove('av-loading');
          el.style.background = 'transparent';
          img.classList.add('av-ready'); // triggers CSS fade-in
          // Stamp timestamp on first successful load
          localStorage.setItem(AVATAR_TS_KEY, Date.now().toString());
        };

        img.onerror = function() {
          el.classList.remove('av-loading');
          // Show letter fallback immediately so UI isn't blank
          el.innerHTML = '';
          el.textContent = avatarLetter;
          el.style.background = avatarBg;

          // Then try to recover via backend (with retry limit)
          if (retryCount < AVATAR_MAX_RETRY && window.API && API.getToken()) {
            API.getMe({ noCache: true }).then(function(fresh) {
              if (!fresh) return;
              const freshPic = (fresh.instagram || {}).profilePic || '';
              if (freshPic && freshPic !== url) {
                // Persist fresh URL to localStorage
                try {
                  const stored = JSON.parse(localStorage.getItem('dmflow_user') || '{}');
                  if (!stored.instagram) stored.instagram = {};
                  stored.instagram.profilePic = freshPic;
                  localStorage.setItem('dmflow_user', JSON.stringify(stored));
                } catch(e) {}
                // Retry with new URL on both elements
                [q('sbAv'), q('mobAv')].forEach(function(av) {
                  if (!av) return;
                  var r = av.id === 'sbAv' ? '10px' : '8px';
                  renderAvatarImg(av, freshPic, r, retryCount + 1);
                });
              }
            }).catch(function() {});
          }
        };

        img.src = url; // set src AFTER attaching handlers
        el.appendChild(img);
      }

      // ── Show letter fallback ──
      function renderAvatarLetter(el) {
        if (!el) return;
        el.classList.remove('av-loading');
        el.innerHTML = '';
        el.textContent = avatarLetter;
        el.style.background = avatarBg;
        el.style.padding = '';
      }

      // ── Apply avatar to element ──
      function applyAvatar(el, radius) {
        if (!el) return;
        if (igPic) {
          renderAvatarImg(el, igPic, radius);
        } else {
          renderAvatarLetter(el);
        }
      }
      applyAvatar(avEl,    '10px');
      applyAvatar(mobAvEl, '8px');

      if (q('sbName'))       q('sbName').textContent       = igUser ? '@' + igUser : name;
      if (q('sbPlan'))       q('sbPlan').textContent       = plan.charAt(0).toUpperCase() + plan.slice(1);
      if (q('dmsLabel'))     q('dmsLabel').textContent     = dmsSent + '/' + dmsLimit;
      if (q('dmsFill'))      q('dmsFill').style.width      = Math.min((dmsSent / dmsLimit) * 100, 100) + '%';
      if (q('igCountLabel')) q('igCountLabel').textContent = igCount + '/' + igLimit;
      if (q('igFill'))       q('igFill').style.width       = Math.min((igCount / igLimit) * 100, 100) + '%';

      // ── Proactive CDN URL refresh ──
      // If profilePic exists but was fetched >20h ago, silently refresh before it expires
      if (igPic && igUser && window.API && API.getToken()) {
        const lastFetch = parseInt(localStorage.getItem(AVATAR_TS_KEY) || '0');
        const age = Date.now() - lastFetch;
        if (age > AVATAR_TTL_MS) {
          API.getMe({ noCache: true }).then(function(fresh) {
            if (!fresh) return;
            const freshPic = (fresh.instagram || {}).profilePic || '';
            if (freshPic) {
              try {
                const stored = JSON.parse(localStorage.getItem('dmflow_user') || '{}');
                if (!stored.instagram) stored.instagram = {};
                stored.instagram.profilePic = freshPic;
                localStorage.setItem('dmflow_user', JSON.stringify(stored));
                localStorage.setItem(AVATAR_TS_KEY, Date.now().toString());
              } catch(e) {}
              // Only re-render if we got a fresh URL
              if (freshPic !== igPic) {
                renderAvatarImg(document.getElementById('sbAv'),    freshPic, '10px');
                renderAvatarImg(document.getElementById('mobAv'),   freshPic, '8px');
              }
            }
          }).catch(function() {});
        }
      }

    } catch (e) {}
  }
  loadUserInfo();

  // ── Refresh user from backend on load ──
  (async function refreshFromBackend() {
    try {
      if (window.API && API.getToken()) {
        const fresh = await API.getMe();
        if (fresh && fresh._id) {
          const existing = JSON.parse(localStorage.getItem('dmflow_user') || '{}');
          const freshIg  = fresh.instagram || {};
          const merged   = { ...existing, ...fresh };
          merged.dmsSent  = fresh.dmsSent  || fresh.dmsSentMonth || existing.dmsSent  || 0;
          merged.dmsLimit = fresh.dmsLimit || fresh.dmLimit      || existing.dmsLimit || 500;
          merged.instagram = {
            connected:  freshIg.connected  ?? existing.instagram?.connected  ?? false,
            username:   freshIg.username   || existing.instagram?.username   || '',
            profilePic: freshIg.profilePic || existing.instagram?.profilePic || '',
            userId:     freshIg.userId     || existing.instagram?.userId     || '',
            pageId:     freshIg.pageId     || existing.instagram?.pageId     || '',
          };
          merged.igConnected = merged.instagram.connected;
          localStorage.setItem('dmflow_user', JSON.stringify(merged));
          loadUserInfo();

          // Auto-refresh Instagram token if near expiry (within 15 days)
          if (merged.instagram?.connected && API.getToken()) {
            const expiry = fresh.instagram?.tokenExpiry;
            const daysLeft = expiry ? (new Date(expiry) - Date.now()) / (1000 * 60 * 60 * 24) : 999;
            if (daysLeft < 15) {
              API.refreshIgToken().catch(() => {});
            }
          }
        }
      }
    } catch(e) {}
  })();

  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'dmflow_user_updated') { loadUserInfo(); }
  });

  // ── Current active page tracking ──
  let _currentPage = 'dashboard';

  // ── Bottom nav active state ──
  const BN_PAGES   = ['dashboard','inbox','automation-builder'];
  const MORE_PAGES = ['contacts','keywords','analytics','templates','settings','support','platform-select'];

  function updateBottomNav(page) {
    document.querySelectorAll('.bn-item').forEach(el => el.classList.remove('active'));
    document.getElementById('bn-more')?.classList.remove('active');

    const bnEl = document.getElementById('bn-' + page);
    if (bnEl) {
      bnEl.classList.add('active');
    } else if (MORE_PAGES.includes(page)) {
      document.getElementById('bn-more')?.classList.add('active');
    }

    const mpMap = {
      contacts: 'mpContacts', keywords: 'mpKeywords', analytics: 'mpAnalytics',
      templates: 'mpTemplates', settings: 'mpSettings', support: 'mpSettings',
    };
    document.querySelectorAll('.more-popup-item').forEach(el => el.classList.remove('active-item'));
    if (mpMap[page]) document.getElementById(mpMap[page])?.classList.add('active-item');
  }

  // ── Navigate: iframe src changes, sidebar + bottom nav update ──
  window.navigate = function (path, page) {
    const frame = document.getElementById('contentFrame');
    frame.classList.add('loading');
    setTimeout(() => {
      frame.src = path;
      frame.onload = () => { frame.classList.remove('loading'); };
      setTimeout(() => frame.classList.remove('loading'), 400);
    }, 80);
    _currentPage = page;

    document.querySelectorAll('.sb-link[data-page]').forEach(l => l.classList.remove('active'));
    const active = document.querySelector('.sb-link[data-page="' + page + '"]');
    if (active) active.classList.add('active');

    updateBottomNav(page);
    sidebarClose();
  };

  window.bnNav = function(path, page) { window.navigate(path, page); };

  document.querySelector('.sb-link[data-page="dashboard"]')?.classList.add('active');
  updateBottomNav('dashboard');

  // ── Sign out ──
  window.signOut = async function () {
    try { await API.logout(); } catch(e) {}
    localStorage.removeItem('dmflow_user');
    localStorage.removeItem('dmflow_token');
    localStorage.removeItem('dmflow_modal_seen');
    localStorage.removeItem('dmflow_avatar_ts');
    sessionStorage.clear();
    window.location.replace('pages/auth/login.html');
  };

  // ── More popup ──
  window.toggleMore = function() {
    const popup   = document.getElementById('morePopup');
    const overlay = document.getElementById('moreOverlay');
    const isShowing = popup.classList.contains('show');
    if (isShowing) { closeMore(); } else { popup.classList.add('show'); overlay.classList.add('show'); }
  };
  window.closeMore = function() {
    document.getElementById('morePopup')?.classList.remove('show');
    document.getElementById('moreOverlay')?.classList.remove('show');
  };

  // ── Sidebar mobile ──
  window.sidebarToggle = function () {
    document.getElementById('sidebar')?.classList.toggle('mob-open');
    document.getElementById('sbOverlay')?.classList.toggle('show');
  };
  window.sidebarClose = function () {
    document.getElementById('sidebar')?.classList.remove('mob-open');
    document.getElementById('sbOverlay')?.classList.remove('show');
    closeMore();
  };

  // ── Handle messages from iframes ──
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'dmflow_back') {
      window.navigate('pages/app/dashboard.html', 'dashboard');
    }
    if (e.data && e.data.type === 'dmflow_navigate') {
      window.navigate(e.data.path, e.data.page);
    }
  });

})();
</script>
