<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/assets/icons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/assets/icons/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/assets/assets/icons/apple-touch-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/assets/assets/icons/apple-touch-icon-167x167.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/assets/assets/icons/apple-touch-icon-120x120.png">
  <link rel="manifest" href="/assets/assets/icons/site.webmanifest">
  <meta name="msapplication-TileImage" content="/assets/assets/icons/mstile-150x150.png">
  <meta name="msapplication-TileColor" content="#0A0A0F">
  <meta name="msapplication-config" content="/assets/assets/icons/browserconfig.xml">
  <meta name="theme-color" content="#0A0A0F">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Inbox – DMFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ─── RESET ─────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Instrument Sans',sans-serif;background-color:#fff7ed;background-image:radial-gradient(circle,#fdba74 1px,transparent 1px);background-size:20px 20px;color:#0A0A0F;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
button,textarea,input{font-family:inherit;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#E2E2EA;border-radius:2px;}

/* ─── APP SHELL ─────────────────────────────────────── */
.app{display:flex;height:100vh;overflow:hidden;background-color:#fff7ed;background-image:radial-gradient(circle,#fdba74 1px,transparent 1px);background-size:20px 20px;}

/* ─── COLUMN 1: THREADS ─────────────────────────────── */
.col-threads{
  width:280px;flex-shrink:0;
  display:flex;flex-direction:column;
  background:#fff;border-right:1px solid #E2E2EA;
  overflow:hidden;transition:transform .25s ease;
}

/* Search */
.threads-search{padding:12px 14px;border-bottom:1px solid #F0F0F6;flex-shrink:0;}
.search-inner{position:relative;display:flex;align-items:center;}
.search-inner svg{position:absolute;left:10px;color:#9898A8;pointer-events:none;}
.search-input{
  width:100%;padding:8px 12px 8px 34px;
  border:1.5px solid #E2E2EA;border-radius:8px;
  font-size:13px;font-family:inherit;outline:none;
  background:#F8F8FC;color:#0A0A0F;transition:border-color .15s,background .15s;
}
.search-input:focus{border-color:#7C3AED;background:#fff;}
.search-input::placeholder{color:#C0C0CC;}

/* Filter tabs */
.filter-tabs{
  display:flex;gap:4px;padding:8px 12px;
  border-bottom:1px solid #F0F0F6;flex-shrink:0;
  overflow-x:auto;scrollbar-width:none;
}
.filter-tabs::-webkit-scrollbar{display:none;}
.ftab{
  padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;
  white-space:nowrap;cursor:pointer;border:none;background:transparent;
  color:#9898A8;transition:background .15s,color .15s;flex-shrink:0;
}
.ftab:hover{background-color:#fff7ed;background-image:radial-gradient(circle,#fdba74 1px,transparent 1px);background-size:20px 20px;color:#0A0A0F;}
.ftab.active{background:#F4F0FF;color:#7C3AED;}

/* Thread list */
.thread-list{flex:1;overflow-y:auto;overflow-x:hidden;}
.thread-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:12px 14px;border-bottom:1px solid #F4F4F8;
  cursor:pointer;transition:background .15s;position:relative;
}
.thread-item:hover{background:#FAFAFA;}
.thread-item.active{background:#F4F0FF;}
.thread-item.active .thread-name{color:#7C3AED;}
.t-av{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#fff;flex-shrink:0;
  overflow:hidden;
}
.t-av img{width:100%;height:100%;object-fit:cover;}
.t-body{flex:1;min-width:0;}
.t-top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:2px;}
.thread-name{font-size:13px;font-weight:600;color:#0A0A0F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.thread-item.unread .thread-name{font-weight:800;}
.t-time{font-size:10px;color:#C0C0CC;flex-shrink:0;}
.t-preview{font-size:12px;color:#9898A8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;}
.t-meta{display:flex;align-items:center;gap:6px;}
.t-tag{
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 6px;border-radius:4px;
  font-size:10px;font-weight:600;
  background:#F4F0FF;color:#7C3AED;
}
.t-label-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.t-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.unread-badge{
  width:18px;height:18px;border-radius:50%;
  background:#7C3AED;color:#fff;
  font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.star-icon{color:#F59E0B;display:flex;align-items:center;}
.star-icon.empty{color:#E2E2EA;}

/* Load more */
.load-more-btn{
  width:100%;padding:12px;
  border:none;background:transparent;
  font-size:12px;font-weight:600;color:#7C3AED;
  cursor:pointer;border-top:1px solid #F0F0F6;
  transition:background .15s;flex-shrink:0;
}
.load-more-btn:hover{background:#F4F0FF;}

/* ─── COLUMN 2: CHAT ────────────────────────────────── */
.col-chat{
  flex:1;display:flex;flex-direction:column;
  background:#F8F8FC;min-width:0;overflow:hidden;
}

/* Chat empty */
.chat-empty{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;
  color:#9898A8;
}
.chat-empty-icon{opacity:.25;}
.chat-empty h3{font-size:15px;font-weight:700;color:#0A0A0F;opacity:.5;}
.chat-empty p{font-size:13px;}

/* Chat header */
.chat-header{
  padding:12px 16px;background:#fff;
  border-bottom:1px solid #E2E2EA;
  flex-shrink:0;display:flex;align-items:center;gap:12px;
}
.chat-header-user{flex:1;display:flex;align-items:center;gap:10px;min-width:0;}
.chat-header-av{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;flex-shrink:0;
  overflow:hidden;position:relative;
}
.chat-header-av img{width:100%;height:100%;object-fit:cover;}
.online-dot{
  width:9px;height:9px;border-radius:50%;
  background:#22C55E;border:2px solid #fff;
  position:absolute;bottom:1px;right:1px;
}
.chat-header-info{min-width:0;}
.chat-header-name{font-size:14px;font-weight:700;color:#0A0A0F;}
.chat-header-sub{font-size:11px;color:#9898A8;display:flex;align-items:center;gap:4px;}
.chat-header-sub svg{opacity:.5;}
.chat-actions{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.icon-btn{
  width:32px;height:32px;border-radius:8px;
  border:none;background:transparent;
  color:#9898A8;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
}
.icon-btn:hover{background-color:#fff7ed;background-image:radial-gradient(circle,#fdba74 1px,transparent 1px);background-size:20px 20px;color:#0A0A0F;}
.icon-btn.active{background:#F4F0FF;color:#7C3AED;}
.back-btn{display:none;margin-right:4px;}

/* Trigger pill */
.trigger-pill{
  margin:8px 16px 0;
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:20px;
  background:#F0F0F6;font-size:11px;color:#9898A8;
  align-self:flex-start;flex-shrink:0;
}
.trigger-pill svg{opacity:.6;}

/* Messages */
.chat-messages{
  flex:1;overflow-y:auto;
  padding:16px;display:flex;flex-direction:column;gap:10px;
}
.msg-wrap{display:flex;flex-direction:column;max-width:72%;}
.msg-wrap.us{align-self:flex-end;align-items:flex-end;}
.msg-wrap.them{align-self:flex-start;align-items:flex-start;}
.msg-bubble{
  padding:10px 13px;font-size:13px;line-height:1.5;
  word-wrap:break-word;
}
.msg-wrap.them .msg-bubble{
  background:#fff;border:1px solid #E2E2EA;
  border-radius:14px 14px 14px 4px;color:#0A0A0F;
}
.msg-wrap.us .msg-bubble{
  background:#7C3AED;color:#fff;
  border-radius:14px 14px 4px 14px;
}
.msg-meta{display:flex;align-items:center;gap:4px;margin-top:3px;}
.msg-time{font-size:10px;color:#9898A8;}
.msg-status{display:flex;align-items:center;color:#9898A8;}
.msg-status.delivered{color:#7C3AED;}

/* Media card */
.media-card{
  background:#fff;border:1px solid #E2E2EA;border-radius:10px;
  padding:10px 12px;display:flex;align-items:center;gap:10px;
  min-width:200px;
}
.media-card-icon{
  width:34px;height:34px;border-radius:8px;
  background:#F4F0FF;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.media-card-info{flex:1;min-width:0;}
.media-card-domain{font-size:11px;color:#9898A8;margin-bottom:2px;}
.media-card-label{font-size:12px;font-weight:600;color:#0A0A0F;}
.media-card-open{
  padding:5px 10px;border-radius:6px;
  background:#7C3AED;color:#fff;
  font-size:11px;font-weight:700;border:none;cursor:pointer;
  white-space:nowrap;transition:background .15s;
}
.media-card-open:hover{background:#6D28D9;}

/* Chat input */
.chat-input-area{
  padding:12px 14px;background:#fff;
  border-top:1px solid #E2E2EA;flex-shrink:0;
  position:relative;
}
.chat-input-row{display:flex;align-items:flex-end;gap:8px;}
.input-icon-btns{display:flex;gap:2px;flex-shrink:0;}
.chat-textarea{
  flex:1;padding:9px 12px;
  border:1.5px solid #E2E2EA;border-radius:10px;
  font-size:13px;font-family:inherit;outline:none;
  resize:none;line-height:1.5;
  min-height:38px;max-height:90px;
  transition:border-color .15s;background:#F8F8FC;
  overflow-y:auto;
}
.chat-textarea:focus{border-color:#7C3AED;background:#fff;}
.send-btn{
  padding:9px 16px;background:#7C3AED;color:#fff;
  border:none;border-radius:8px;font-size:13px;font-weight:700;
  cursor:pointer;transition:background .15s,opacity .15s;
  flex-shrink:0;display:flex;align-items:center;gap:6px;
  height:38px;
}
.send-btn:hover{background:#6D28D9;}
.send-btn:disabled{opacity:.5;cursor:not-allowed;}
.input-error{
  font-size:11px;color:#EF4444;margin-top:5px;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}

/* Template popup */
.template-popup{
  position:absolute;bottom:calc(100% + 8px);left:14px;right:14px;
  background:#fff;border:1px solid #E2E2EA;border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.1);z-index:50;overflow:hidden;
  animation:popUp .15s ease;
}
@keyframes popUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.template-popup-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;border-bottom:1px solid #F0F0F6;
}
.template-popup-title{font-size:12px;font-weight:700;color:#0A0A0F;}
.template-row{
  padding:10px 12px;cursor:pointer;border-bottom:1px solid #F8F8FC;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  transition:background .12s;
}
.template-row:last-child{border-bottom:none;}
.template-row:hover{background:#F8F8FC;}
.template-row-text{font-size:12px;color:#0A0A0F;flex:1;}
.template-use-btn{
  padding:4px 10px;border-radius:5px;
  background:#F4F0FF;color:#7C3AED;
  font-size:11px;font-weight:700;border:none;cursor:pointer;
  flex-shrink:0;transition:background .12s;
}
.template-use-btn:hover{background:#EDE9FF;}
.template-popup-empty{padding:16px;text-align:center;font-size:12px;color:#9898A8;}

/* Tooltip */
[data-tooltip]{position:relative;}
[data-tooltip]::after{
  content:attr(data-tooltip);
  position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:#0A0A0F;color:#fff;font-size:10px;font-weight:600;
  padding:4px 8px;border-radius:5px;white-space:nowrap;
  pointer-events:none;opacity:0;transition:opacity .15s;z-index:99;
}
[data-tooltip]:hover::after{opacity:1;}

/* ─── COLUMN 3: INFO PANEL ──────────────────────────── */
.col-info{
  width:300px;flex-shrink:0;
  background:#fff;border-left:1px solid #E2E2EA;
  display:flex;flex-direction:column;overflow:hidden;
  transition:width .22s ease,opacity .22s ease;
}
.col-info.hidden{width:0;opacity:0;pointer-events:none;}
.info-header{
  padding:14px 16px;border-bottom:1px solid #E2E2EA;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.info-header-title{font-family:'Bricolage Grotesque',sans-serif;font-size:14px;font-weight:700;}
.info-body{flex:1;overflow-y:auto;padding:0;}

/* Info sections */
.info-section{padding:14px 16px;border-bottom:1px solid #F4F4F8;}
.info-section-title{font-size:11px;font-weight:700;color:#9898A8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
.info-avatar-block{display:flex;flex-direction:column;align-items:center;gap:8px;}
.info-av-large{
  width:58px;height:58px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;color:#fff;overflow:hidden;
}
.info-av-large img{width:100%;height:100%;object-fit:cover;}
.info-name{font-size:15px;font-weight:700;color:#0A0A0F;}
.info-username{font-size:12px;color:#9898A8;}
.info-ig-link{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:600;color:#7C3AED;
  text-decoration:none;transition:opacity .15s;margin-top:2px;
}
.info-ig-link:hover{opacity:.75;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.stat-box{
  padding:8px;border-radius:8px;background:#F8F8FC;
  text-align:center;
}
.stat-val{font-size:13px;font-weight:700;color:#0A0A0F;}
.stat-lbl{font-size:10px;color:#9898A8;margin-top:1px;}
.automation-row{display:flex;flex-direction:column;gap:6px;}
.auto-item{display:flex;align-items:center;justify-content:space-between;font-size:12px;}
.auto-key{color:#9898A8;}
.auto-val{font-weight:600;color:#0A0A0F;text-align:right;flex:1;margin-left:8px;}

/* Labels */
.labels-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.label-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;
  cursor:pointer;transition:opacity .15s;
}
.label-pill:hover{opacity:.8;}
.add-label-btn{
  width:100%;padding:8px;border-radius:8px;
  border:1.5px dashed #E2E2EA;background:transparent;
  font-size:12px;font-weight:600;color:#9898A8;
  cursor:pointer;transition:border-color .15s,color .15s;
}
.add-label-btn:hover{border-color:#7C3AED;color:#7C3AED;}
.label-dropdown{
  margin-top:6px;background:#fff;border:1px solid #E2E2EA;
  border-radius:8px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.08);
}
.label-option{
  padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:8px;transition:background .12s;
}
.label-option:hover{background:#F8F8FC;}
.label-dot{width:8px;height:8px;border-radius:50%;}

/* Notes */
.notes-textarea{
  width:100%;padding:8px 10px;
  border:1.5px solid #E2E2EA;border-radius:8px;
  font-size:12px;font-family:inherit;outline:none;
  resize:none;line-height:1.5;height:70px;
  background:#F8F8FC;transition:border-color .15s;
}
.notes-textarea:focus{border-color:#7C3AED;background:#fff;}
.save-notes-btn{
  width:100%;margin-top:6px;padding:7px;
  border-radius:8px;border:none;
  background:#7C3AED;color:#fff;
  font-size:12px;font-weight:700;cursor:pointer;
  transition:background .15s;
}
.save-notes-btn:hover{background:#6D28D9;}
.notes-saved{font-size:11px;color:#22C55E;margin-top:4px;display:none;}

/* Quick actions */
.quick-actions{display:flex;gap:8px;}
.qa-btn{
  flex:1;padding:8px;border-radius:8px;
  border:1.5px solid #E2E2EA;background:transparent;
  font-size:12px;font-weight:600;cursor:pointer;
  color:#0A0A0F;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px;
}
.qa-btn:hover{border-color:#7C3AED;color:#7C3AED;background:#F4F0FF;}
.qa-btn.danger:hover{border-color:#EF4444;color:#EF4444;background:#FEF2F2;}

/* ─── SKELETON ──────────────────────────────────────── */
@keyframes skPulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.sk{background:#F0F0F6;border-radius:6px;animation:skPulse 1.4s ease-in-out infinite;}
.sk-thread{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid #F4F4F8;align-items:flex-start;}
.sk-av{width:38px;height:38px;border-radius:50%;flex-shrink:0;}
.sk-body{flex:1;display:flex;flex-direction:column;gap:6px;padding-top:4px;min-width:0;}
.sk-line{height:10px;border-radius:4px;}
.sk-msg{margin:4px 0;}
.sk-bubble{height:38px;border-radius:12px;}

/* ─── MOBILE OVERLAY ────────────────────────────────── */
.mobile-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.4);z-index:80;
  opacity:0;transition:opacity .25s;pointer-events:none;
}
.mobile-overlay.visible{opacity:1;pointer-events:all;}

/* ─── DESKTOP LAYOUT ────────────────────────────────── */
@media(min-width:768px){
  .back-btn{display:none !important;}
  .col-info.mobile-open{
    position:static;transform:none;
    box-shadow:none;
  }
}

/* ─── MOBILE LAYOUT ─────────────────────────────────── */
@media(max-width:767px){
  .app{position:relative;overflow:hidden;}

  /* All 3 cols are overlaid */
  .col-threads{
    position:absolute;inset:0;width:100%;z-index:10;
    transform:translateX(0);
  }
  .col-threads.slide-out{transform:translateX(-100%);pointer-events:none;}

  .col-chat{
    position:absolute;inset:0;width:100%;z-index:20;
    transform:translateX(100%);
    background:#F8F8FC;
  }
  .col-chat.slide-in{transform:translateX(0);}

  .col-info{
    position:fixed;top:0;right:0;bottom:0;
    width:90vw;max-width:320px;z-index:90;
    transform:translateX(100%);opacity:1;pointer-events:all;
    box-shadow:-8px 0 32px rgba(0,0,0,.12);
    transition:transform .25s ease;
  }
  .col-info.hidden{width:90vw;max-width:320px;opacity:1;transform:translateX(100%);}
  .col-info.mobile-open{transform:translateX(0);}

  .back-btn{display:flex !important;}

  .mobile-overlay{display:block;}
}

/* ─── TRANSITIONS ────────────────────────────────────── */
.col-threads,.col-chat{transition:transform .25s ease;}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ══════════ COL 1: THREADS ══════════ -->
  <div class="col-threads" id="colThreads">

    <!-- Search -->
    <div class="threads-search">
      <div class="search-inner">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" type="text" id="searchInput" placeholder="Search conversations…" oninput="onSearch(this.value)">
      </div>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs" id="filterTabs">
      <button class="ftab active" data-filter="all" onclick="setFilter('all',this)">All</button>
      <button class="ftab" data-filter="unread" onclick="setFilter('unread',this)">Unread</button>
      <button class="ftab" data-filter="lead" onclick="setFilter('lead',this)">Leads</button>
      <button class="ftab" data-filter="customer" onclick="setFilter('customer',this)">Customers</button>
      <button class="ftab" data-filter="spam" onclick="setFilter('spam',this)">Spam</button>

<script>
/* ═══════════════════════════════════════════════════════
   AUTH CHECK
══════════════════════════════════════════════════════════ */
(function(){
  const u = JSON.parse(localStorage.getItem('dmflow_user')||'null');
  if(!u){
    const dest = '/app/auth/login.html';
    if(window!==window.top) window.top.location.href = '/app/auth/login.html';
    else window.location.href = dest;

/* ═══════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════ */
let activeThreadId  = null;
let activeThreadData = null;
let pollTimer       = null;
let searchTimer     = null;
let searchVal       = '';
let currentFilter   = 'all';
let currentPage     = 1;
let totalPages      = 1;
let infoOpen        = false;
let templateOpen    = false;
let labelDropOpen   = false;
let isMobile        = window.innerWidth < 768;

const LABEL_OPTIONS = [
  {id:'lead',     label:'Lead',      color:'#0EA5E9', bg:'#EFF8FF'},
  {id:'customer', label:'Customer',  color:'#22C55E', bg:'#F0FDF4'},
  {id:'spam',     label:'Spam',      color:'#EF4444', bg:'#FEF2F2'},
  {id:'followup', label:'Follow-up', color:'#F59E0B', bg:'#FFFBEB'},
  {id:'vip',      label:'VIP',       color:'#7C3AED', bg:'#F4F0FF'},
];
const DEFAULT_TEMPLATES = [
  'Thanks for reaching out! How can I help you today?',
  'Here is the link you requested:',
  'We will get back to you within 24 hours.',
  'Thank you for your interest!',
];

/* ═══════════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════════════ */
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function timeAgo(d){
  if(!d) return '';
  const m = Math.floor((Date.now()-new Date(d).getTime())/60000);
  if(m<1) return 'just now';
  if(m<60) return m+'m';
  const h=Math.floor(m/60);
  if(h<24) return h+'h';
  const dy=Math.floor(h/24);
  if(dy<7) return dy+'d';
  return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
}
function stringColor(s){
  const c=['#7C3AED','#E1306C','#0EA5E9','#22C55E','#F59E0B','#EF4444'];
  let h=0;
  for(let i=0;i<(s||'').length;i++) h=s.charCodeAt(i)+((h<<5)-h);
  return c[Math.abs(h)%c.length];
}
function fmtTime(d){
  if(!d) return '';
  return new Date(d).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
function getLabels(tid){ return JSON.parse(localStorage.getItem('dmf_labels_'+tid)||'[]'); }
function setLabels(tid,arr){ localStorage.setItem('dmf_labels_'+tid,JSON.stringify(arr)); }
function getStarred(tid){ return JSON.parse(localStorage.getItem('dmf_starred')||'[]').includes(tid); }
function toggleStar(tid){
  const arr=JSON.parse(localStorage.getItem('dmf_starred')||'[]');
  const i=arr.indexOf(tid);
  if(i>-1) arr.splice(i,1); else arr.push(tid);
  localStorage.setItem('dmf_starred',JSON.stringify(arr));
}
function getNotes(tid){ return localStorage.getItem('dmf_notes_'+tid)||''; }
function setNotes(tid,v){ localStorage.setItem('dmf_notes_'+tid,v); }
function getArchived(tid){ return JSON.parse(localStorage.getItem('dmf_archived')||'[]').includes(tid); }
function setArchived(tid,val){
  const arr=JSON.parse(localStorage.getItem('dmf_archived')||'[]');
  if(val && !arr.includes(tid)) arr.push(tid);
  else if(!val){ const i=arr.indexOf(tid); if(i>-1) arr.splice(i,1); }
  localStorage.setItem('dmf_archived',JSON.stringify(arr));
}
function getTemplates(){ return JSON.parse(localStorage.getItem('dmf_templates')||JSON.stringify(DEFAULT_TEMPLATES)); }
function isInstagramUrl(t){ return typeof t==='string'&&(t.startsWith('http://instagram.com')||t.startsWith('https://instagram.com')||t.startsWith('https://www.instagram.com')); }

function apiHeaders(){
  const token = localStorage.getItem('dmflow_token');
  return token ? {'Content-Type':'application/json','Authorization':'Bearer '+token} : {'Content-Type':'application/json'};
}
function apiBase(){
  
  return window.DMFLOW_API_URL || 'https://api.dmflowapp.in';
}

/* ═══════════════════════════════════════════════════════
   THREAD LIST
══════════════════════════════════════════════════════════ */
function onSearch(v){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{ searchVal=v.trim(); currentPage=1; loadThreads(); }, 350);
}
function setFilter(f,btn){
  currentFilter=f; currentPage=1;
  document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  loadThreads();
}

function skeletonThreads(){
  return [0,1,2,3,4].map(()=>`
    <div class="sk-thread">
      <div class="sk sk-av"></div>
      <div class="sk-body">
        <div class="sk sk-line" style="width:55%"></div>
        <div class="sk sk-line" style="width:75%;margin-top:2px"></div>
      </div>
    </div>`).join('');
}

async function loadThreads(append=false){
  const list = document.getElementById('threadList');
  if(!append){ list.innerHTML = skeletonThreads(); }

  let threads=[], total=0, pages=1;

  try{
    if(window.API && API.getToken()){
      const res = await API.getInbox(currentPage, searchVal);
      threads = res.threads||[];
      total   = res.total||0;
      pages   = res.pages||1;
    } else {
      // demo fallback
      threads = DEMO_THREADS;
      total   = DEMO_THREADS.length;
      pages   = 1;
    }
  } catch(e){
    threads = DEMO_THREADS;
    total   = DEMO_THREADS.length;
    pages   = 1;
  }

  totalPages = pages;

  // Client-side filter
  let filtered = threads;
  if(currentFilter==='unread')   filtered = threads.filter(t=>t.unread && !getArchived(t._id));
  else if(currentFilter==='starred') filtered = threads.filter(t=>getStarred(t._id) && !getArchived(t._id));
  else if(currentFilter==='archived') filtered = threads.filter(t=>getArchived(t._id));
  else if(['lead','customer','spam','followup','vip'].includes(currentFilter))
    filtered = threads.filter(t=>getLabels(t._id).includes(currentFilter) && !getArchived(t._id));
  else if(currentFilter==='all') filtered = threads.filter(t=>!getArchived(t._id));

  if(!filtered.length && !append){
    list.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;text-align:center;gap:10px;">
      <svg width="40" height="40" fill="none" viewBox="0 0 24 24" opacity=".2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="#9898A8" stroke-width="1.5" stroke-linecap="round"/></svg>
      <div style="font-size:13px;font-weight:700;color:#9898A8">No conversations yet</div>
      <div style="font-size:12px;color:#C0C0CC;line-height:1.5">Conversations from your automations<br>will appear here.</div>
    </div>`;
    document.getElementById('loadMoreBtn').style.display='none';
    return;
  }

  const html = filtered.map(t=>{
    const initials = (t.username||t.name||'?')[0].toUpperCase();
    const name     = t.name || ('@'+(t.username||'unknown'));
    const preview  = t.lastMessage||'—';
    const labels   = getLabels(t._id);
    const starred  = getStarred(t._id);
    const col      = stringColor(t.username||t._id);
    const labelObj = labels.length ? LABEL_OPTIONS.find(l=>l.id===labels[0]) : null;

    return `<div class="thread-item${t.unread?' unread':''}${activeThreadId===t._id?' active':''}" id="ti-${t._id}" onclick="openThread('${t._id}')">
      <div class="t-av" style="background:${col}">
        ${t.avatar ? `<img src="${esc(t.avatar)}" alt="${esc(initials)}" onerror="this.style.display='none'">` : ''}
        ${initials}
      </div>
      <div class="t-body">
        <div class="t-top">
          <span class="thread-name">${esc(name)}</span>
          <span class="t-time">${timeAgo(t.lastAt)}</span>
        </div>
        <div class="t-preview">${esc(preview)}</div>
        <div class="t-meta">
          ${t.automationTriggered?`<span class="t-tag"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg> Auto DM</span>`:''}
          ${labelObj?`<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;background:${labelObj.bg};color:${labelObj.color}">${labelObj.label}</span>`:''}
        </div>
      </div>
      <div class="t-right">
        ${t.unread&&(t.unreadCount||0)>0?`<div class="unread-badge">${t.unreadCount}</div>`:''}
        ${starred?`<div class="star-icon"><svg width="11" height="11" viewBox="0 0 24 24" fill="#F59E0B" stroke="#F59E0B" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>`:''}
      </div>
    </div>`;
  }).join('');

  if(append){ list.insertAdjacentHTML('beforeend', html); }
  else { list.innerHTML = html; }

  document.getElementById('loadMoreBtn').style.display = (currentPage < totalPages) ? 'block' : 'none';

  // Load DPs from /api/ig-avatar for all threads that don't have avatar
  filtered.forEach(t => {
    if(!t.avatar && t.username){
      loadThreadDP(t._id, t.username);
    }
  });
}

async function loadMoreThreads(){
  currentPage++;
  await loadThreads(true);
}

/* ═══════════════════════════════════════════════════════
   DP / PROFILE LOADING via /api/ig-avatar & /api/ig-lookup
══════════════════════════════════════════════════════════ */
const _dpCache = {};   // key → avatar url
const _profileCache = {}; // key → full profile

function isNumericId(val){ return /^\d{6,}$/.test(String(val||'')); }

async function loadThreadDP(tid, usernameOrId){
  if(!usernameOrId) return;
  const key = String(usernameOrId);
  if(_dpCache[key]){
    _applyDP(tid, key, _dpCache[key]);
    return;
  }
  try{
    if(isNumericId(key)){
      // Numeric IG user ID — must resolve via backend (has the token)
      await loadThreadProfile(tid, key);
    } else {
      // Real @username — use CF proxy
      const url = `/api/ig-avatar/${encodeURIComponent(key)}`;
      const res = await fetch(url);
      if(!res.ok) return;
      const blob = await res.blob();
      const objUrl = URL.createObjectURL(blob);
      _dpCache[key] = objUrl;
      _applyDP(tid, key, objUrl);
      const t = (window._inboxThreads||[]).find(t=>t._id===tid) ||
                DEMO_THREADS.find(t=>t._id===tid);
      if(t) t.avatar = objUrl;
    }
  } catch(e){}
}

function _applyDP(tid, key, avatarUrl){
  // Thread list avatar
  const avEl = document.querySelector(`#ti-${tid} .t-av`);
  if(avEl && !avEl.querySelector('img')){
    const img = document.createElement('img');
    img.src = avatarUrl;
    img.alt = username;
    img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%';
    img.onerror = ()=>img.remove();
    avEl.style.position = 'relative';
    avEl.insertBefore(img, avEl.firstChild);
  }
  // Chat header avatar (if this thread is open)
  if(activeThreadId === tid){
    const chatAv = document.getElementById('chatAv');
    if(chatAv && !chatAv.querySelector('img')){
      chatAv.innerHTML += `<img src="${avatarUrl}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.remove()"><div class="online-dot"></div>`;
    }
    // Info panel large avatar
    const infoAv = document.querySelector('.info-av-large');
    if(infoAv && !infoAv.querySelector('img')){
      const img = document.createElement('img');
      img.src = avatarUrl;
      img.alt = '';
      img.onerror = ()=>img.remove();
      infoAv.insertBefore(img, infoAv.firstChild);
    }
  }
}

async function loadThreadProfile(tid, usernameOrId){
  if(!usernameOrId) return;
  const key = String(usernameOrId);
  if(_profileCache[key]){
    _applyProfileStats(tid, _profileCache[key]);
    return;
  }
  try{
    let data;
    if(isNumericId(key)){
      // Numeric IG user ID → call our backend which has the page token
      if(!window.API || !API.getToken()) return;
      const BASE = || window.DMFLOW_API_URL || '';
      const res = await fetch(`${BASE}/api/ig-profile/${encodeURIComponent(key)}`, {
        headers: { 'Authorization': 'Bearer ' + API.getToken() }
      });
      if(!res.ok) return;
      data = await res.json();
      // Normalize to same shape as ig-lookup
      data = {
        found: true,
        username:   data.username   || '',
        fullName:   data.name       || data.fullName || '',
        profilePic: data.profile_picture_url || data.profilePic || '',
        followers:  data.followers  ?? null,
        following:  data.following  ?? null,
        posts:      data.posts      ?? null,
        biography:  data.biography  || '',
        isVerified: data.is_verified || false,
      };
    } else {
      // Real @username → CF ig-lookup scraper
      const res = await fetch(`/api/ig-lookup?username=${encodeURIComponent(key)}`);
      if(!res.ok) return;
      data = await res.json();
      if(!data.found) return;
    }
    _profileCache[key] = data;
    // Update thread data
    const t = (window._inboxThreads||[]).find(t=>t._id===tid) ||
              DEMO_THREADS.find(t=>t._id===tid);
    if(t){
      if(data.followers != null) t.followers = data.followers;
      if(data.following != null) t.following = data.following;
      if(data.posts     != null) t.posts     = data.posts;
      t.isVerified = data.isVerified;
      if(data.biography) t.biography = data.biography;
      // Update display username if we resolved it from numeric ID
      if(data.username && isNumericId(t.username)) t.igUsername = data.username;
      if(data.fullName  && (!t.name || isNumericId(t.name))) t.name = data.fullName;
      if(data.profilePic){
        t.avatar = data.profilePic;
        _dpCache[key] = data.profilePic;
        _applyDP(tid, key, data.profilePic);
      }
    }
    _applyProfileStats(tid, data);
  } catch(e){}
}

function _applyProfileStats(tid, data){
  // Update stat boxes if info panel is open for this thread
  if(activeThreadId !== tid) return;
  const statBoxes = document.querySelectorAll('#infoBody .stat-box');
  statBoxes.forEach(box=>{
    const lbl = box.querySelector('.stat-lbl');
    const val = box.querySelector('.stat-val');
    if(!lbl||!val) return;
    if(lbl.textContent==='Followers' && data.followers != null) val.textContent = Number(data.followers).toLocaleString();
    if(lbl.textContent==='Following' && data.following != null) val.textContent = Number(data.following).toLocaleString();
    if(lbl.textContent==='Posts'     && data.posts     != null) val.textContent = data.posts;
  });
  // Update bio
  const bioEl = document.getElementById('igBio');
  if(bioEl && data.biography){ bioEl.textContent = data.biography; bioEl.style.display = ''; }
  // Update display name in info panel
  if(data.fullName || data.name){
    const nameEl = document.querySelector('#infoBody .info-name');
    if(nameEl){ nameEl.childNodes[0].textContent = data.fullName || data.name; }
  }
  // Show real @username if we resolved it from numeric ID
  if(data.username){
    const handleEl = document.querySelector('#infoBody .info-username');
    if(handleEl) handleEl.textContent = '@' + data.username;
    const igLink = document.querySelector('#infoBody .info-ig-link');
    if(igLink) igLink.href = 'https://instagram.com/' + data.username;
  }
  // Update chat header name
  const chatName = document.getElementById('chatName');
  if(chatName && (data.fullName || data.name)){
    chatName.textContent = data.fullName || data.name;
  }
  // Verified badge
  if(data.isVerified){
    const nameEl = document.querySelector('#infoBody .info-name');
    if(nameEl && !nameEl.querySelector('.verified-badge')){
      nameEl.insertAdjacentHTML('beforeend', ` <svg class="verified-badge" width="13" height="13" viewBox="0 0 24 24" fill="#7C3AED"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`);
    }
  }
}

/* ═══════════════════════════════════════════════════════
   OPEN THREAD
══════════════════════════════════════════════════════════ */
async function openThread(id){

    document.getElementById('colChat').classList.add('slide-in');

  const col  = stringColor(id);

  const chat = document.getElementById('colChat');
  chat.innerHTML = `

          ${initials}
          <div class="online-dot"></div>
        </div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="chatName">${esc(name)}</div>
          <div class="chat-header-sub">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
            Instagram DM
          </div>
        </div>
      </div>
      <div class="chat-actions">
        <button class="icon-btn${starred?' active':''}" id="starBtn" onclick="toggleStarThread()" data-tooltip="${starred?'Unstar':'Star'}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="${starred?'#F59E0B':'none'}" stroke="${starred?'#F59E0B':'currentColor'}" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </button>
        <button class="icon-btn" onclick="showLabelMenu()" data-tooltip="Label" id="labelMenuBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
        </button>

/* ═══════════════════════════════════════════════════════
   LOAD MESSAGES
══════════════════════════════════════════════════════════ */
let lastMsgIds = new Set();

async function loadMessages(id, initial=false){
  const msgsEl = document.getElementById('chatMessages');
  if(!msgsEl) return;

  let msgs=[], thread=null;
  try{
    if(window.API&&API.getToken()){
      thread = await API.getThread(id);
      msgs   = thread.messages||[];
    } else {
      thread = DEMO_THREADS.find(t=>t._id===id)||{};
      msgs   = DEMO_MESSAGES[id]||[];
    }
  } catch(e){
    thread = DEMO_THREADS.find(t=>t._id===id)||{};
    msgs   = DEMO_MESSAGES[id]||[];
  }

  activeThreadData = thread;

  // Trigger pill
  const pillWrap = document.getElementById('triggerPillWrap');
  if(pillWrap && thread.automationTriggered){
    pillWrap.innerHTML=`<div class="trigger-pill">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      Triggered by Auto DM · keyword: ${esc(thread.triggerKeyword||'price')}
    </div>`;
  }

  // Update header avatar/name
  if(initial && thread){
    const chatAv = document.getElementById('chatAv');
    const chatName = document.getElementById('chatName');
    if(chatAv && thread.avatar){
      chatAv.innerHTML += `<img src="${esc(thread.avatar)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.remove()"><div class="online-dot"></div>`;
    }
    if(chatName) chatName.textContent = thread.name||('@'+(thread.igUsername||(!isNumericId(thread.username)?thread.username:null)||'unknown'));
  }

  if(!msgs.length && initial){
    msgsEl.innerHTML='<div style="flex:1;display:flex;align-items:center;justify-content:center;color:#9898A8;font-size:13px;flex-direction:column;gap:8px;padding:40px"><svg width="36" height="36" fill="none" viewBox="0 0 24 24" opacity=".2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="#9898A8" stroke-width="1.5"/></svg>No messages yet</div>';
    return;
  }

  if(initial){
    lastMsgIds = new Set(msgs.map(m=>m._id||m.sentAt+'_'+m.from));
    msgsEl.innerHTML = msgs.map(m=>renderMsg(m)).join('');
    msgsEl.scrollTop = msgsEl.scrollHeight;
  } else {
    // Append only new ones
    const newMsgs = msgs.filter(m=>!lastMsgIds.has(m._id||m.sentAt+'_'+m.from));
    if(newMsgs.length){
      newMsgs.forEach(m=>{
        lastMsgIds.add(m._id||m.sentAt+'_'+m.from);
        msgsEl.insertAdjacentHTML('beforeend', renderMsg(m));
      });
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }
  }
}

async function pollMessages(id){
  if(id!==activeThreadId) return;
  await loadMessages(id, false);
}

function renderMsg(m){
  const isUs  = m.from==='user';
  const t     = fmtTime(m.sentAt);
  const delivered = !!m.igMsgId;

  if(isInstagramUrl(m.text)){
    const domain = (() => { try{ return new URL(m.text).hostname.replace('www.',''); }catch(e){ return 'instagram.com'; } })();
    return `<div class="msg-wrap${isUs?' us':' them'}">
      <div class="media-card">
        <div class="media-card-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
        </div>
        <div class="media-card-info">
          <div class="media-card-domain">${esc(domain)}</div>
          <div class="media-card-label">Instagram Link</div>
        </div>
        <button class="media-card-open" onclick="window.open('${esc(m.text)}','_blank')">Open</button>
      </div>
      <div class="msg-meta">
        <span class="msg-time">${t}</span>
        ${isUs?msgStatusSvg(delivered):''}
      </div>
    </div>`;
  }

  return `<div class="msg-wrap${isUs?' us':' them'}">
    <div class="msg-bubble">${esc(m.text)}</div>
    <div class="msg-meta">
      <span class="msg-time">${t}</span>
      ${isUs?msgStatusSvg(delivered):''}
    </div>
  </div>`;
}

function msgStatusSvg(delivered){
  if(delivered) return `<span class="msg-status delivered" title="Delivered">
    <svg width="13" height="10" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 7 6 12 17 1"/><polyline points="7 12 17 1" opacity=".6"/></svg>
  </span>`;
  return `<span class="msg-status" title="Saved">
    <svg width="11" height="9" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 7 6 12 17 1"/></svg>
  </span>`;
}

/* ═══════════════════════════════════════════════════════
   SEND REPLY
══════════════════════════════════════════════════════════ */
function handleKey(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendReply(); } }
function autoGrow(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,90)+'px'; }

async function sendReply(){
  if(!activeThreadId) return;
  const input = document.getElementById('replyInput');
  const btn   = document.getElementById('sendBtn');
  const text  = input?.value.trim();
  if(!text) return;

  input.value=''; input.style.height='auto';
  btn.disabled=true;

  // Optimistic
  const msgsEl = document.getElementById('chatMessages');
  const tempId  = 'tmp_'+Date.now();
  if(msgsEl){
    const now = fmtTime(new Date());
    msgsEl.insertAdjacentHTML('beforeend',
      `<div class="msg-wrap us" id="${tempId}">
        <div class="msg-bubble">${esc(text)}</div>
        <div class="msg-meta"><span class="msg-time">${now}</span></div>
       </div>`);
    msgsEl.scrollTop=msgsEl.scrollHeight;
  }

  try{
    if(window.API&&API.getToken()) await API.sendReply(activeThreadId, text);
  } catch(e){
    showInputError('Could not send. Please try again.');
    const tmp=document.getElementById(tempId);
    if(tmp) tmp.remove();
    input.value=text;
  } finally{
    if(btn) btn.disabled=false;
  }
}

function showInputError(msg){
  const area=document.getElementById('chatInputArea');
  if(!area) return;
  let err=area.querySelector('.input-error');
  if(!err){ err=document.createElement('div'); err.className='input-error'; area.appendChild(err); }
  err.textContent=msg;
  clearTimeout(err._t);
  err._t=setTimeout(()=>err.remove(),3000);
}

function toggleTemplates(){
  templateOpen=!templateOpen;

function toggleLabelDropdown(){

function addLabel(lid){
  if(!activeThreadId) return;
  const labels=getLabels(activeThreadId);
  if(!labels.includes(lid)){ labels.push(lid); setLabels(activeThreadId,labels); }
  document.getElementById('labelDropdown').style.display='none';
  renderInfoPanel(activeThreadId);
  loadThreads();
}
function removeLabel(lid){
  if(!activeThreadId) return;
  const labels=getLabels(activeThreadId).filter(l=>l!==lid);
  setLabels(activeThreadId,labels);
  renderInfoPanel(activeThreadId);
  loadThreads();
}
function saveNotes(){
  if(!activeThreadId) return;
  const v=document.getElementById('notesArea')?.value||'';
  setNotes(activeThreadId,v);
  const saved=document.getElementById('notesSaved');
  if(saved){ saved.style.display='block'; setTimeout(()=>saved.style.display='none',2000); }
}

function markUnread(){
  if(!activeThreadId) return;
  const ti=document.getElementById('ti-'+activeThreadId);
  if(ti){ ti.classList.add('unread'); }
}
function archiveThread(){
  if(!activeThreadId) return;
  setArchived(activeThreadId, true);
  goBackToList();
  closeInfo();
  loadThreads();
}
function unarchiveThread(){
  if(!activeThreadId) return;
  setArchived(activeThreadId, false);
  goBackToList();
  closeInfo();
  loadThreads();
}
