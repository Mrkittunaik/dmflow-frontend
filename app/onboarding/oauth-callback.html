<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/public/assets/assets/icons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/public/assets/assets/icons/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/public/assets/assets/icons/apple-touch-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/public/assets/assets/icons/apple-touch-icon-167x167.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/public/assets/assets/icons/apple-touch-icon-120x120.png">
  <link rel="manifest" href="/public/assets/assets/icons/site.webmanifest">
  <meta name="msapplication-TileImage" content="/public/assets/assets/icons/mstile-150x150.png">
  <meta name="msapplication-TileColor" content="#0A0A0F">
  <meta name="msapplication-config" content="/public/assets/assets/icons/browserconfig.xml">
  <meta name="theme-color" content="#0A0A0F">
  
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Signing in... – DMFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Instrument Sans',sans-serif;background:#F8F8FC;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px;}
.logo{font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:800;color:#0A0A0F;margin-bottom:8px;}
.logo span{color:#7C3AED;}
.spinner{width:40px;height:40px;border:3px solid #E2E2EA;border-top-color:#7C3AED;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{font-size:15px;color:#5A5A6E;font-weight:500;}
.error-box{background:#fff;border:1.5px solid #ef4444;border-radius:12px;padding:20px 28px;text-align:center;max-width:360px;}
.error-box h2{color:#ef4444;font-size:16px;margin-bottom:8px;}
.error-box p{font-size:13px;color:#5A5A6E;margin-bottom:14px;}
.error-box a{display:inline-block;padding:9px 20px;background:#0A0A0F;color:#fff;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;}
</style>
</head>
<body>
<div class="logo">DM<span>Flow</span></div>
<div class="spinner" id="spinner"></div>
<div class="msg" id="msg">Completing sign in...</div>
<div class="error-box" id="errorBox" style="display:none;">
  <h2>Sign in failed</h2>
  <p id="errorMsg">Something went wrong. Please try again.</p>
  <a href="/app/auth/login.html">Back to Login</a>
</div>

<script src="/public/assets/scripts/config.js"></script>
<script src="/public/assets/scripts/api.js"></script>
<script>
(function() {
  const urlParams = new URLSearchParams(window.location.search);
  const code     = urlParams.get('code');
  const error    = urlParams.get('error');
  const provider = urlParams.get('provider') || 'google'; // google | facebook

  // Strip query params immediately
  window.history.replaceState({}, document.title, window.location.pathname);

  function showError(msg) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('msg').style.display = 'none';
    document.getElementById('errorBox').style.display = '';
    document.getElementById('errorMsg').textContent = msg || 'Something went wrong. Please try again.';
  }

  if (error) {
    const label = provider === 'facebook' ? 'Facebook' : 'Google';
    showError(label + ' sign-in was cancelled or failed.');
    return;
  }

  if (!code) {
    showError('No sign-in code found. Please try again.');
    return;
  }

  // Exchange one-time code for JWT
  // Both Google and Facebook use the same /auth/google/token endpoint pattern
  // Facebook uses /auth/facebook/token
  const tokenEndpoint = provider === 'facebook'
    ? '/app/auth/facebook/token'
    : '/app/auth/google/token';

  document.getElementById('msg').textContent = 'Completing sign in...';

  fetch(API.BASE_URL + tokenEndpoint + '?code=' + encodeURIComponent(code))
    .then(r => r.json())
    .then(data => {
      if (!data.token) throw new Error('No token');
      API.setToken(data.token);
      document.getElementById('msg').textContent = 'Getting your profile...';
      return API.getMe();
    })
    .then(user => {
      const ig = user.instagram || {};
      localStorage.setItem('dmflow_user', JSON.stringify({
        name:        user.name,
        avatar:      user.avatar || (user.name || 'U')[0].toUpperCase(),
        plan:        user.plan || 'free',
        dmsSent:     user.dmsSent  || user.dmsSentMonth || 0,
        dmsLimit:    user.dmsLimit || user.dmLimit      || 500,
        igConnected: ig.connected  || false,
        instagram: {
          connected:  ig.connected  || false,
          username:   ig.username   || '',
          profilePic: ig.profilePic || '',
          userId:     ig.userId     || '',
          pageId:     ig.pageId     || '',
        },
      }));
      document.getElementById('msg').textContent = 'Welcome ' + user.name + '! Redirecting...';
      setTimeout(() => {
        window.location.href = user.instagram?.connected
          ? '/app/platforms/instagram/dashboard.html'
          : '/app/onboarding/platform-select.html';
      }, 800);
    })
    .catch(() => {
      showError('Could not load your profile. Please try again.');
    });
})();
</script>
</body>
</html>
