<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="dmflow-api" content="https://dmflow-backend-u9h8.onrender.com">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Keywords – DMFlow</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Instrument Sans',sans-serif;background:#F4F4F8;color:#0A0A0F;-webkit-font-smoothing:antialiased;}
.main{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff;border-bottom:1px solid #E2E2EA;flex-shrink:0;}
.topbar-title{font-family:'Bricolage Grotesque',sans-serif;font-size:16px;font-weight:800;}
.scroll{flex:1;overflow-y:auto;padding:24px;}
.scroll::-webkit-scrollbar{width:4px;}
.scroll::-webkit-scrollbar-thumb{background:#E2E2EA;border-radius:2px;}
.add-form{background:#fff;border:1.5px solid #E2E2EA;border-radius:14px;padding:20px 24px;margin-bottom:20px;}
.add-form h3{font-family:'Bricolage Grotesque',sans-serif;font-size:15px;font-weight:800;margin-bottom:14px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-group label{font-size:11px;font-weight:700;color:#9898A8;text-transform:uppercase;letter-spacing:.5px;}
.form-input{padding:9px 12px;border:1.5px solid #E2E2EA;border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#F8F8FC;}
.form-input:focus{border-color:#7C3AED;background:#fff;}
.form-textarea{padding:9px 12px;border:1.5px solid #E2E2EA;border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#F8F8FC;resize:vertical;min-height:70px;}
.form-textarea:focus{border-color:#7C3AED;background:#fff;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .2s;}
.btn-primary{background:#0A0A0F;color:#fff;}
.btn-primary:hover{background:#2A2A3A;}
.kw-list{display:flex;flex-direction:column;gap:10px;}
.kw-card{background:#fff;border:1.5px solid #E2E2EA;border-radius:14px;padding:16px 20px;display:flex;align-items:flex-start;gap:16px;}
.kw-badge{display:inline-flex;align-items:center;padding:4px 12px;background:#0A0A0F;color:#C8FF00;border-radius:20px;font-size:12px;font-weight:800;letter-spacing:.5px;flex-shrink:0;}
.kw-body{flex:1;min-width:0;}
.kw-label{font-size:11px;font-weight:700;color:#9898A8;margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px;}
.kw-text{font-size:13px;color:#0A0A0F;line-height:1.5;}
.kw-actions{display:flex;gap:6px;flex-shrink:0;}
.icon-btn{width:30px;height:30px;border-radius:7px;border:1.5px solid #E2E2EA;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#9898A8;transition:all .2s;}
.icon-btn:hover{border-color:#0A0A0F;color:#0A0A0F;}
.icon-btn.del:hover{border-color:#EF4444;color:#EF4444;}
.empty-state{text-align:center;padding:60px 20px;color:#9898A8;}
.empty-state svg{margin:0 auto 12px;display:block;opacity:.4;}
.empty-state h3{font-size:15px;font-weight:700;color:#0A0A0F;margin-bottom:6px;}
.empty-state p{font-size:13px;}
.toast{position:fixed;bottom:24px;right:24px;background:#22C55E;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.15);animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.form-row{grid-template-columns:1fr;}}
@media(max-width:600px){
  .scroll{padding:14px;}
  .add-form{padding:14px 16px;border-radius:12px;}
  .add-form h3{font-size:14px;}
  .form-input,.form-textarea{font-size:12px;padding:8px 10px;}
  .btn{padding:8px 14px;font-size:12px;}
  .kw-card{padding:12px 14px;gap:10px;border-radius:12px;}
  .kw-badge{font-size:11px;padding:3px 10px;}
  .kw-text{font-size:12px;}
}
</style>
</head>
<body>
<div class="main">
  <div class="topbar">
    <div class="topbar-title">Keywords</div>
  </div>
  <div class="scroll">

    <!-- Add keyword form -->
    <div class="add-form">
      <h3>Add Keyword Trigger</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Keyword *</label>
          <input class="form-input" type="text" id="kwWord" placeholder="e.g. LINK, FREE, INFO" style="text-transform:uppercase;">
        </div>
        <div class="form-group">
          <label>Match Type</label>
          <select class="form-input" id="kwMatchType">
            <option value="exact">Exact match</option>
            <option value="contains">Contains</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Comment Reply (public)</label>
          <textarea class="form-textarea" id="kwReplyText" placeholder="Check your DMs!"></textarea>
        </div>
        <div class="form-group">
          <label>DM Text (private)</label>
          <textarea class="form-textarea" id="kwDmText" placeholder="Hey {{name}}! Here's the link you asked for…"></textarea>
        </div>
      </div>
      <button class="btn btn-primary" onclick="addKeyword()">
        <svg width="13" height="13" fill="none" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        Add Keyword
      </button>
    </div>

    <!-- Keywords list -->
    <div id="kwList" class="kw-list">
      <div style="text-align:center;padding:30px;color:#9898A8;font-size:13px;">Loading keywords…</div>
    </div>
    <div id="emptyState" class="empty-state" style="display:none;">
      <svg width="48" height="48" fill="none" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z" stroke="#C0C0CC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="7" y1="7" x2="7.01" y2="7" stroke="#C0C0CC" stroke-width="2.5" stroke-linecap="round"/></svg>
      <h3>No keywords yet</h3>
      <p>Add a keyword above to trigger automatic DMs when someone comments with that word.</p>
    </div>

  </div>
</div>

<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/api.js"></script>
<script>
(function() {
  const user = JSON.parse(localStorage.getItem('dmflow_user') || 'null');
  if (!user) { if (window !== window.top) { window.top.location.href = 'pages/auth/login.html'; } else { window.location.href = '../auth/login.html'; }; return; }
})();

function showToast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.background = type === 'error' ? '#EF4444' : '#22C55E';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function loadKeywords() {
  const list = document.getElementById('kwList');
  list.innerHTML = '<div style="text-align:center;padding:30px;color:#9898A8;font-size:13px;">Loading…</div>';
  if (!window.API || !API.getToken()) { list.innerHTML = ''; document.getElementById('emptyState').style.display=''; return; }
  try {
    const keywords = await API.getKeywords();
    if (!keywords.length) {
      list.innerHTML = '';
      document.getElementById('emptyState').style.display = '';
      return;
    }
    document.getElementById('emptyState').style.display = 'none';
    list.innerHTML = keywords.map(kw => `
      <div class="kw-card" id="kw-${kw._id}">
        <div class="kw-badge">${escHtml(kw.word)}</div>
        <div class="kw-body">
          <div style="display:flex;gap:20px;flex-wrap:wrap;">
            ${kw.replyText ? `<div><div class="kw-label">Comment Reply</div><div class="kw-text">${escHtml(kw.replyText)}</div></div>` : ''}
            ${kw.dmText    ? `<div><div class="kw-label">DM Text</div><div class="kw-text">${escHtml(kw.dmText)}</div></div>` : ''}
          </div>
          <div style="margin-top:6px;font-size:11px;color:#9898A8;">Match: ${kw.matchType || 'exact'}</div>
        </div>
        <div class="kw-actions">
          <button class="icon-btn del" title="Delete" onclick="deleteKeyword('${kw._id}')">
            <svg width="13" height="13" fill="none" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    `).join('');
  } catch(e) {
    list.innerHTML = '<div style="text-align:center;padding:30px;color:#EF4444;font-size:13px;">Error: ' + escHtml(e.message) + '</div>';
  }
}

async function addKeyword() {
  const word      = document.getElementById('kwWord').value.trim().toUpperCase();
  const matchType = document.getElementById('kwMatchType').value;
  const replyText = document.getElementById('kwReplyText').value.trim();
  const dmText    = document.getElementById('kwDmText').value.trim();

  if (!word) { showToast('Enter a keyword.', 'error'); return; }
  if (!window.API || !API.getToken()) { showToast('Not logged in.', 'error'); return; }

  try {
    await API.createKeyword({ word, matchType, replyText, dmText });
    document.getElementById('kwWord').value      = '';
    document.getElementById('kwReplyText').value = '';
    document.getElementById('kwDmText').value    = '';
    showToast('Keyword added!');
    loadKeywords();
  } catch(e) {
    showToast(e.message || 'Could not add keyword.', 'error');
  }
}

async function deleteKeyword(id) {
  if (!confirm('Delete this keyword?')) return;
  const card = document.getElementById('kw-' + id);
  if (card) card.style.opacity = '0.4';
  try {
    await API.deleteKeyword(id);
    if (card) card.remove();
    showToast('Keyword deleted.');
    const remaining = document.querySelectorAll('.kw-card').length;
    if (!remaining) document.getElementById('emptyState').style.display = '';
  } catch(e) {
    if (card) card.style.opacity = '1';
    showToast(e.message || 'Could not delete.', 'error');
  }
}

loadKeywords();
</script>
</body>
</html>
