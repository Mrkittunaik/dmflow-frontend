<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Notifications – DMFlow WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/css/whatsapp/wa-core.css">
</head>
<body class="wa-scope">
<div class="wa-app">
  <div id="waSidebarMount"></div>
  <div class="wa-main">
    <div class="wa-topbar">
      <div class="wa-topbar-title">Notifications</div>
      <div class="wa-topbar-actions">
        <button class="wa-btn wa-btn-outline wa-btn-sm">Mark all as read</button>
        <button class="wa-icon-btn" id="waThemeBtn" onclick="WA_UI.toggleTheme()"></button>
        <a class="wa-avatar" href="settings.html" title="Account settings" style="text-decoration:none;">A</a>
      </div>
    </div>
    <div class="wa-scroll"><div class="wa-pad" style="max-width:640px;">
      <div class="wa-card" id="waNotifList"></div>
    </div></div>
  </div>
</div>

<script src="../../../assets/js/whatsapp/wa-nav.js"></script>
<script src="../../../assets/js/whatsapp/wa-ui.js"></script>
<script>
WA_UI.initTheme(); WA_NAV.render('notifications');
const notifs = [
  { icon:'👤', title:'New lead: Priya Sharma', sub:'via Price Enquiry Bot', time:'2m ago', unread:true },
  { icon:'🧾', title:'New order #4821', sub:'₹1,299 · Rohit Kumar', time:'14m ago', unread:true },
  { icon:'💬', title:'New conversation started', sub:'Anjali Verma', time:'40m ago', unread:true },
  { icon:'⚠️', title:'Automation failed', sub:'Abandoned Cart Recovery — template not approved', time:'38m ago', unread:false },
  { icon:'✅', title:'Template approved', sub:'flash_sale_promo', time:'1h ago', unread:false },
  { icon:'📵', title:'WhatsApp temporarily disconnected', sub:'Reconnected automatically', time:'3h ago', unread:false },
  { icon:'💰', title:'Payment received', sub:'₹899 · Order #4819', time:'5h ago', unread:false }
];
document.getElementById('waNotifList').innerHTML = notifs.map((n,i) => `
  <div style="display:flex;gap:12px;padding:14px 18px;${i<notifs.length-1?'border-bottom:1px solid var(--wa-border-soft);':''}${n.unread?'background:var(--wa-green-pale);':''}">
    <div style="font-size:18px;">${n.icon}</div>
    <div class="wa-grow">
      <div style="font-size:12.5px;font-weight:700;">${n.title}</div>
      <div style="font-size:11.5px;color:var(--wa-text-3);margin-top:2px;">${n.sub}</div>
    </div>
    <div style="font-size:10.5px;color:var(--wa-text-3);flex-shrink:0;">${n.time}</div>
  </div>`).join('');
</script>
</body>
</html>
