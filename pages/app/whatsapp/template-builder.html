<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Template Builder – DMFlow WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/css/whatsapp/wa-core.css">
<style>
.wa-tb{display:flex;height:100%;overflow:hidden;}
.wa-tb-form{flex:1;overflow-y:auto;padding:22px 26px;display:flex;flex-direction:column;gap:16px;max-width:640px;}
.wa-tb-preview-col{width:340px;flex-shrink:0;border-left:1px solid var(--wa-border);background:var(--wa-bg-sunken);display:flex;flex-direction:column;align-items:center;padding:26px 18px;}

.wa-phone{width:280px;background:#0A0A0F;border-radius:20px;padding:8px;box-shadow:var(--wa-shadow-lg);}
.wa-phone-screen{background:#E5DDD5;border-radius:14px;overflow:hidden;min-height:420px;display:flex;flex-direction:column;}
.wa-phone-head{background:var(--wa-green-dark);color:#fff;padding:12px 14px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;}
.wa-phone-body{flex:1;padding:12px;}
.wa-phone-bubble{background:#fff;border-radius:var(--wa-r);padding:9px 11px;font-size:12px;line-height:1.5;box-shadow:0 1px 1px rgba(0,0,0,.08);}
.wa-phone-header-img{width:100%;height:90px;background:linear-gradient(135deg,var(--wa-green),var(--wa-green-teal));border-radius:var(--wa-r-sm);margin-bottom:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;}
.wa-phone-footer{font-size:10px;color:#8696a0;margin-top:6px;}
.wa-phone-btn{border-top:1px solid #f0f0f0;text-align:center;padding:8px 0;font-size:12px;color:var(--wa-blue);font-weight:600;}

.wa-btn-row{display:flex;gap:8px;align-items:flex-end;}
.wa-var-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;background:var(--wa-green-pale);color:var(--wa-green-dark);padding:3px 8px;border-radius:var(--wa-r-sm);cursor:pointer;border:none;}
</style>
</head>
<body class="wa-scope">
<div class="wa-app">
  <div id="waSidebarMount"></div>
  <div class="wa-main">
    <div class="wa-builder-topbar" style="display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--wa-bg-panel);border-bottom:1px solid var(--wa-border);">
      <div class="wa-flex wa-gap-10">
        <a href="templates.html" class="wa-icon-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></a>
        <span class="wa-card-title">New Template</span>
      </div>
      <div class="wa-flex wa-gap-8">
        <button class="wa-btn wa-btn-outline wa-btn-sm">Save Draft</button>
        <button class="wa-btn wa-btn-primary wa-btn-sm">Submit for Approval</button>
      </div>
    </div>

    <div class="wa-tb">
      <div class="wa-tb-form">

        <div class="wa-card wa-card-pad">
          <div class="wa-section-label" style="margin-bottom:10px;">Basics</div>
          <div class="wa-flex-col wa-gap-14">
            <div class="wa-field"><label class="wa-label">Template name</label><input class="wa-input" id="tplName" placeholder="e.g. order_confirmation" value="order_confirmation"></div>
            <div class="wa-btn-row">
              <div class="wa-field" style="flex:1;"><label class="wa-label">Category</label>
                <select class="wa-select" id="tplCat">
                  <option>Utility</option><option>Marketing</option><option>Authentication</option>
                </select>
              </div>
              <div class="wa-field" style="flex:1;"><label class="wa-label">Language</label>
                <select class="wa-select"><option>English</option><option>Hindi</option><option>Spanish</option></select>
              </div>
            </div>
          </div>
        </div>

        <div class="wa-card wa-card-pad">
          <div class="wa-section-label" style="margin-bottom:10px;">Header</div>
          <select class="wa-select" id="tplHeaderType">
            <option>None</option><option selected>Image</option><option>Text</option><option>Video</option><option>Document</option>
          </select>
        </div>

        <div class="wa-card wa-card-pad">
          <div class="wa-section-label" style="margin-bottom:10px;">Body</div>
          <textarea class="wa-textarea" id="tplBody" style="min-height:100px;">Hi {{customer.name}}, your order {{order.id}} has been confirmed and will arrive by {{order.eta}}.</textarea>
          <div class="wa-flex wa-gap-6" style="margin-top:8px;flex-wrap:wrap;">
            <button class="wa-var-chip" onclick="insertVar('customer.name')">+ customer.name</button>
            <button class="wa-var-chip" onclick="insertVar('order.id')">+ order.id</button>
            <button class="wa-var-chip" onclick="insertVar('order.eta')">+ order.eta</button>
            <button class="wa-var-chip" onclick="insertVar('order.total')">+ order.total</button>
          </div>
        </div>

        <div class="wa-card wa-card-pad">
          <div class="wa-section-label" style="margin-bottom:10px;">Footer (optional)</div>
          <input class="wa-input" id="tplFooter" placeholder="e.g. DMFlow — Powered by WhatsApp Business" value="Thank you for shopping with us!">
        </div>

        <div class="wa-card wa-card-pad">
          <div class="wa-flex wa-between" style="margin-bottom:10px;">
            <div class="wa-section-label">Buttons</div>
            <button class="wa-btn wa-btn-outline wa-btn-sm">+ Add Button</button>
          </div>

          <div class="wa-flex-col wa-gap-10">
            <div class="wa-card" style="border-color:var(--wa-border-soft);">
              <div class="wa-card-pad" style="display:flex;flex-direction:column;gap:8px;">
                <div class="wa-btn-row">
                  <div class="wa-field" style="flex:1;"><label class="wa-label">Button label</label><input class="wa-input" value="Track Order"></div>
                  <div class="wa-field" style="flex:1;"><label class="wa-label">Action</label>
                    <select class="wa-select">
                      <option>Track Order</option><option>Open Product</option><option>Open Catalog</option>
                      <option>Start Automation</option><option>Custom URL</option><option>Call Business</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
            <div class="wa-card" style="border-color:var(--wa-border-soft);">
              <div class="wa-card-pad" style="display:flex;flex-direction:column;gap:8px;">
                <div class="wa-btn-row">
                  <div class="wa-field" style="flex:1;"><label class="wa-label">Button label</label><input class="wa-input" value="View Order"></div>
                  <div class="wa-field" style="flex:1;"><label class="wa-label">Action</label>
                    <select class="wa-select">
                      <option>Open Product</option><option selected>Custom URL</option><option>Start Automation</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Live preview -->
      <div class="wa-tb-preview-col">
        <div class="wa-section-label" style="margin-bottom:14px;">Live Preview</div>
        <div class="wa-phone">
          <div class="wa-phone-screen">
            <div class="wa-phone-head">
              <div style="width:26px;height:26px;border-radius:50%;background:var(--wa-green);"></div>
              Aarav Fashion Co.
            </div>
            <div class="wa-phone-body">
              <div class="wa-phone-bubble">
                <div class="wa-phone-header-img" id="pvHeaderImg">Image header</div>
                <div id="pvBody">Hi Priya, your order #4821 has been confirmed and will arrive by Fri, 20 Jun.</div>
                <div class="wa-phone-footer" id="pvFooter">Thank you for shopping with us!</div>
              </div>
              <div class="wa-phone-bubble" style="margin-top:6px;padding:0;overflow:hidden;">
                <div class="wa-phone-btn">📦 Track Order</div>
                <div class="wa-phone-btn">🧾 View Order</div>
              </div>
            </div>
          </div>
        </div>
        <div class="wa-hint" style="margin-top:14px;text-align:center;">Preview updates as you edit the body text.</div>
      </div>
    </div>
  </div>
</div>

<script src="../../../assets/js/whatsapp/wa-nav.js"></script>
<script src="../../../assets/js/whatsapp/wa-ui.js"></script>
<script>
WA_UI.initTheme();
WA_NAV.render('templates');

const bodyInput = document.getElementById('tplBody');
const pvBody = document.getElementById('pvBody');
const sample = { 'customer.name':'Priya', 'order.id':'#4821', 'order.eta':'Fri, 20 Jun', 'order.total':'₹1,299' };

function renderPreview(){
  let txt = bodyInput.value;
  Object.keys(sample).forEach(k => { txt = txt.split('{{'+k+'}}').join(sample[k]); });
  pvBody.textContent = txt;
}
bodyInput.addEventListener('input', renderPreview);
document.getElementById('tplFooter').addEventListener('input', e => {
  document.getElementById('pvFooter').textContent = e.target.value;
});
document.getElementById('tplHeaderType').addEventListener('change', e => {
  const img = document.getElementById('pvHeaderImg');
  img.style.display = e.target.value === 'Image' ? 'flex' : 'none';
});
function insertVar(v){
  bodyInput.value += ' {{' + v + '}}';
  renderPreview();
}
renderPreview();
</script>
</body>
</html>
