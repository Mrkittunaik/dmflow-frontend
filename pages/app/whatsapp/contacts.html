<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Contacts – DMFlow WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/css/whatsapp/wa-core.css">
<style>
.wa-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.wa-toolbar-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.wa-name-cell{display:flex;align-items:center;gap:10px;}
.wa-name-cell .wa-avatar{width:28px;height:28px;font-size:11px;}
</style>
</head>
<body class="wa-scope">
<div class="wa-app">
  <div id="waSidebarMount"></div>
  <div class="wa-main">
    <div class="wa-topbar">
      <div class="wa-topbar-title">Contacts</div>
      <div class="wa-topbar-actions">
        <button class="wa-icon-btn" id="waThemeBtn" onclick="WA_UI.toggleTheme()"></button>
        <a class="wa-avatar" href="settings.html" title="Account settings" style="text-decoration:none;">A</a>
      </div>
    </div>
    <div class="wa-scroll"><div class="wa-pad">

      <div class="wa-toolbar">
        <div class="wa-toolbar-left">
          <div class="wa-topbar-search" style="width:240px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input type="text" placeholder="Search contacts…">
          </div>
          <button class="wa-btn wa-btn-outline wa-btn-sm">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            Filter
          </button>
        </div>
        <div class="wa-flex wa-gap-8">
          <button class="wa-btn wa-btn-outline wa-btn-sm">Export</button>
          <button class="wa-btn wa-btn-outline wa-btn-sm">Import</button>
          <button class="wa-btn wa-btn-primary wa-btn-sm" onclick="document.getElementById('waAddModal').style.display='flex'">+ Add Contact</button>
        </div>
      </div>

      <div class="wa-card">
        <table class="wa-table">
          <thead>
            <tr>
              <th style="width:32px;"><input type="checkbox" class="wa-table-check"></th>
              <th>Name</th><th>Phone</th><th>Tags</th><th>Source</th><th>Last Interaction</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="waContactsBody"></tbody>
        </table>
      </div>

    </div></div>
  </div>
</div>

<!-- Add contact modal -->
<div class="wa-modal-overlay" id="waAddModal" style="display:none;">
  <div class="wa-modal">
    <div class="wa-modal-head">
      <div class="wa-card-title">Add Contact</div>
      <button class="wa-icon-btn" onclick="document.getElementById('waAddModal').style.display='none'">✕</button>
    </div>
    <div class="wa-modal-body">
      <div class="wa-field"><label class="wa-label">Name</label><input class="wa-input" placeholder="e.g. Priya Sharma"></div>
      <div class="wa-field"><label class="wa-label">Phone (WhatsApp)</label><input class="wa-input" placeholder="+91 90000 00000"></div>
      <div class="wa-field"><label class="wa-label">Tags</label><input class="wa-input" placeholder="Lead, Interested…"></div>
    </div>
    <div class="wa-modal-foot">
      <button class="wa-btn wa-btn-ghost" onclick="document.getElementById('waAddModal').style.display='none'">Cancel</button>
      <button class="wa-btn wa-btn-primary" onclick="WA_UI.toast('Contact added','success');document.getElementById('waAddModal').style.display='none'">Add Contact</button>
    </div>
  </div>
</div>

<script src="../../../assets/js/config.js"></script>
<script src="../../../assets/js/api.js"></script>
<script src="../../../assets/js/whatsapp/wa-nav.js"></script>
<script src="../../../assets/js/whatsapp/wa-ui.js"></script>
<script>
WA_UI.initTheme();
WA_NAV.render('contacts');

function timeAgo(iso) {
  if (!iso) return '—';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return 'Just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  if (days === 1) return 'Yesterday';
  return `${days} days ago`;
}

async function loadContacts(search) {
  const body = document.getElementById('waContactsBody');
  try {
    const { contacts } = await API.getWhatsAppContacts(1, search);
    if (!contacts.length) {
      body.innerHTML = '<tr><td colspan="7" class="wa-muted" style="padding:16px;">No contacts yet.</td></tr>';
      return;
    }
    body.innerHTML = contacts.map(c => `
      <tr>
        <td><input type="checkbox" class="wa-table-check"></td>
        <td>
          <div class="wa-name-cell">
            <div class="wa-avatar">${(c.name || c.phone || '?')[0]}</div>
            <span class="wa-bold">${c.name || c.phone}</span>
          </div>
        </td>
        <td>${c.phone}</td>
        <td>${(c.tags || []).map(t=>`<span class="wa-tag" style="margin-right:4px;">${t}</span>`).join('') || '<span class="wa-muted">—</span>'}</td>
        <td>${c.source}</td>
        <td class="wa-muted">${timeAgo(c.lastContact)}</td>
        <td><span class="wa-badge ${c.optedOut ? 'gray' : 'green'}">${c.optedOut ? 'Opted out' : 'Active'}</span></td>
        <td><button class="wa-icon-btn" style="width:28px;height:28px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg></button></td>
      </tr>`).join('');
  } catch (err) {
    console.error('Failed to load contacts:', err);
    body.innerHTML = '<tr><td colspan="7" class="wa-muted" style="padding:16px;">Could not load contacts.</td></tr>';
  }
}

document.querySelector('.wa-topbar-search input').addEventListener('input', (e) => {
  clearTimeout(window._waContactSearchDebounce);
  window._waContactSearchDebounce = setTimeout(() => loadContacts(e.target.value), 300);
});

loadContacts();
</script>
</body>
</html>
