<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Products – DMFlow WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/css/whatsapp/wa-core.css">
<style>
.wa-prod-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.wa-prod-card{background:var(--wa-bg-panel);border:1px solid var(--wa-border);border-radius:var(--wa-r);overflow:hidden;}
.wa-prod-img{height:130px;background:linear-gradient(135deg,var(--wa-green-pale),var(--wa-border-soft));display:flex;align-items:center;justify-content:center;color:var(--wa-green-dark);}
.wa-prod-body{padding:12px 14px;}
.wa-prod-name{font-size:12.5px;font-weight:700;}
.wa-prod-price{font-size:13px;font-weight:800;color:var(--wa-green-dark);margin-top:4px;font-family:var(--wa-font-head);}
.wa-prod-old{font-size:11px;color:var(--wa-text-3);text-decoration:line-through;margin-left:6px;}
.wa-prod-stock{font-size:10.5px;color:var(--wa-text-3);margin-top:4px;}
.wa-prod-actions{display:flex;gap:6px;padding:10px 14px 14px;}
@media(max-width:1100px){.wa-prod-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:760px){.wa-prod-grid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body class="wa-scope">
<div class="wa-app">
  <div id="waSidebarMount"></div>
  <div class="wa-main">
    <div class="wa-topbar">
      <div class="wa-topbar-title">Products</div>
      <div class="wa-topbar-actions">
        <button class="wa-icon-btn" id="waThemeBtn" onclick="WA_UI.toggleTheme()"></button>
        <div class="wa-avatar">A</div>
      </div>
    </div>
    <div class="wa-scroll"><div class="wa-pad">

      <div class="wa-flex wa-between">
        <div class="wa-topbar-search" style="width:260px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input type="text" placeholder="Search products…">
        </div>
        <button class="wa-btn wa-btn-primary wa-btn-sm">+ Add Product</button>
      </div>

      <div class="wa-prod-grid" id="waProdGrid"></div>

    </div></div>
  </div>
</div>

<script src="../../../assets/js/whatsapp/wa-nav.js"></script>
<script src="../../../assets/js/whatsapp/wa-ui.js"></script>
<script>
WA_UI.initTheme();
WA_NAV.render('products');

const products = [
  { name:'Classic Formal Shirt', price:'₹1,299', old:'₹1,599', stock:42 },
  { name:'Slim Fit Chinos', price:'₹1,899', old:null, stock:18 },
  { name:'Casual Polo Tee', price:'₹799', old:'₹999', stock:65 },
  { name:'Leather Belt', price:'₹599', old:null, stock:0 },
  { name:'Denim Jacket', price:'₹2,499', old:'₹2,999', stock:9 },
  { name:'Cotton Kurta', price:'₹1,099', old:null, stock:27 },
  { name:'Formal Trousers', price:'₹1,399', old:null, stock:33 },
  { name:'Sneakers', price:'₹2,199', old:'₹2,699', stock:14 }
];

document.getElementById('waProdGrid').innerHTML = products.map(p => `
  <div class="wa-prod-card">
    <div class="wa-prod-img"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="3" y="8" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 8V6a4 4 0 018 0v2" stroke="currentColor" stroke-width="1.6"/></svg></div>
    <div class="wa-prod-body">
      <div class="wa-prod-name">${p.name}</div>
      <div class="wa-prod-price">${p.price}${p.old?`<span class="wa-prod-old">${p.old}</span>`:''}</div>
      <div class="wa-prod-stock">${p.stock>0 ? p.stock+' in stock' : '<span style="color:var(--wa-red);font-weight:700;">Out of stock</span>'}</div>
    </div>
    <div class="wa-prod-actions">
      <button class="wa-btn wa-btn-outline wa-btn-sm" style="flex:1;">Edit</button>
      <button class="wa-btn wa-btn-outline wa-btn-sm wa-btn-icon" title="Send on WhatsApp">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2 22l4.832-1.438A9.956 9.956 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2z" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>
  </div>`).join('');
</script>
</body>
</html>
