<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Automations – DMFlow WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/css/whatsapp/wa-core.css">
<style>
.wa-tabs{display:flex;gap:4px;border-bottom:1px solid var(--wa-border);}
.wa-tab{font-size:12.5px;font-weight:700;padding:9px 14px;color:var(--wa-text-2);cursor:pointer;border-bottom:2px solid transparent;}
.wa-tab.active{color:var(--wa-green-dark);border-bottom-color:var(--wa-green-dark);}

.wa-auto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.wa-auto-card{background:var(--wa-bg-panel);border:1px solid var(--wa-border);border-radius:var(--wa-r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;}
.wa-auto-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.wa-auto-name{font-family:var(--wa-font-head);font-size:14px;font-weight:800;}
.wa-auto-trigger{font-size:11.5px;color:var(--wa-text-2);display:flex;align-items:center;gap:5px;}
.wa-auto-stats{display:flex;gap:16px;padding:10px 0;border-top:1px solid var(--wa-border-soft);border-bottom:1px solid var(--wa-border-soft);}
.wa-auto-stat-num{font-family:var(--wa-font-head);font-size:15px;font-weight:800;}
.wa-auto-stat-lbl{font-size:10px;color:var(--wa-text-3);text-transform:uppercase;letter-spacing:.3px;}
.wa-auto-actions{display:flex;gap:6px;}
@media(max-width:1200px){.wa-auto-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:700px){.wa-auto-grid{grid-template-columns:1fr;}}
</style>
</head>
<body class="wa-scope">
<div class="wa-app">
  <div id="waSidebarMount"></div>
  <div class="wa-main">
    <div class="wa-topbar">
      <div class="wa-topbar-title">Automations</div>
      <div class="wa-topbar-actions">
        <button class="wa-icon-btn" id="waThemeBtn" onclick="WA_UI.toggleTheme()"></button>
        <div class="wa-avatar">A</div>
      </div>
    </div>
    <div class="wa-scroll"><div class="wa-pad">

      <div class="wa-flex wa-between">
        <div class="wa-tabs">
          <div class="wa-tab active">All</div>
          <div class="wa-tab">Active</div>
          <div class="wa-tab">Draft</div>
          <div class="wa-tab">Paused</div>
          <div class="wa-tab">Templates</div>
        </div>
        <a href="automation-builder.html" class="wa-btn wa-btn-primary wa-btn-sm">+ Create Automation</a>
      </div>

      <div class="wa-auto-grid" id="waAutoGrid"><div class="wa-muted" style="padding:16px;">Loading…</div></div>

    </div></div>
  </div>
</div>

<script src="../../../assets/js/config.js"></script>
<script src="../../../assets/js/api.js"></script>
<script src="../../../assets/js/whatsapp/wa-nav.js"></script>
<script src="../../../assets/js/whatsapp/wa-ui.js"></script>
<script>
WA_UI.initTheme();
WA_NAV.render('automations');

async function loadAutomations() {
  const grid = document.getElementById('waAutoGrid');
  try {
    const all = await API.getAutomations();
    const automations = all.filter(a => a.channel === 'whatsapp');

    if (!automations.length) {
      grid.innerHTML = '<div class="wa-muted" style="padding:16px;">No WhatsApp automations yet.</div>';
      return;
    }

    grid.innerHTML = automations.map(a => {
      const triggerLabel = (a.trigger?.whatsappEvents || []).map(e => e.replace('whatsapp_', '').replace(/_/g, ' ')).join(', ') || 'No trigger set';
      return `
      <div class="wa-auto-card">
        <div class="wa-auto-top">
          <div>
            <div class="wa-auto-name">${a.name}</div>
            <div class="wa-auto-trigger">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14h7l-1 8 11-14h-7l1-6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
              ${triggerLabel}
            </div>
          </div>
          <span class="wa-badge ${a.active ? 'green' : 'gray'}">${a.active ? 'active' : 'paused'}</span>
        </div>
        <div class="wa-auto-stats">
          <div><div class="wa-auto-stat-num">${(a.stats?.triggered || 0).toLocaleString()}</div><div class="wa-auto-stat-lbl">Triggered</div></div>
          <div><div class="wa-auto-stat-num">${(a.stats?.dmsSent || 0).toLocaleString()}</div><div class="wa-auto-stat-lbl">DMs Sent</div></div>
        </div>
        <div class="wa-auto-actions">
          <a href="automation-builder.html?id=${a._id}" class="wa-btn wa-btn-outline wa-btn-sm">Edit</a>
          <button class="wa-btn wa-btn-outline wa-btn-sm" data-toggle="${a._id}">${a.active ? 'Pause' : 'Activate'}</button>
        </div>
      </div>`;
    }).join('');

    grid.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', async () => {
        try {
          await API.toggleAutomation(btn.dataset.toggle);
          loadAutomations();
        } catch (err) {
          alert('Could not toggle automation: ' + err.message);
        }
      });
    });
  } catch (err) {
    console.error('Failed to load automations:', err);
    grid.innerHTML = '<div class="wa-muted" style="padding:16px;">Could not load automations.</div>';
  }
}

loadAutomations();
</script>
</body>
</html>
