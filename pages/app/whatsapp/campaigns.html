<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Campaigns – DMFlow WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/css/whatsapp/wa-core.css">
</head>
<body class="wa-scope">
<div class="wa-app">
  <div id="waSidebarMount"></div>
  <div class="wa-main">
    <div class="wa-topbar">
      <div class="wa-topbar-title">Campaigns</div>
      <div class="wa-topbar-actions">
        <button class="wa-icon-btn" id="waThemeBtn" onclick="WA_UI.toggleTheme()"></button>
        <a class="wa-avatar" href="settings.html" title="Account settings" style="text-decoration:none;">A</a>
      </div>
    </div>
    <div class="wa-scroll"><div class="wa-pad">

      <div class="wa-flex wa-between">
        <div class="wa-card-title">All Campaigns</div>
        <button class="wa-btn wa-btn-primary wa-btn-sm" onclick="openCampModal()">+ Create Campaign</button>
      </div>

      <div class="wa-card">
        <table class="wa-table">
          <thead><tr><th>Campaign</th><th>Audience</th><th>Sent</th><th>Delivered</th><th>Read</th><th>Replied</th><th>Converted</th><th>Status</th><th></th></tr></thead>
          <tbody id="waCampBody"><tr><td colspan="9" class="wa-muted">Loading…</td></tr></tbody>
        </table>
      </div>

    </div></div>
  </div>
</div>

<!-- create campaign wizard modal -->
<div class="wa-modal-overlay" id="waCampModal" style="display:none;">
  <div class="wa-modal" style="width:520px;">
    <div class="wa-modal-head">
      <div class="wa-card-title">Create Campaign</div>
      <button class="wa-icon-btn" onclick="document.getElementById('waCampModal').style.display='none'">✕</button>
    </div>
    <div class="wa-modal-body">
      <div class="wa-field"><label class="wa-label">Campaign name</label><input class="wa-input" id="waCampName" placeholder="e.g. Diwali Flash Sale"></div>
      <div class="wa-field"><label class="wa-label">Audience</label>
        <select class="wa-select" id="waCampAudience"><option value="all">All Contacts</option></select>
      </div>
      <div class="wa-field"><label class="wa-label">Template</label>
        <select class="wa-select" id="waCampTemplate"><option value="">Loading templates…</option></select>
      </div>
      <div class="wa-field"><label class="wa-label">Schedule</label>
        <select class="wa-select" id="waCampSchedule"><option value="now">Send now</option><option value="later">Schedule for later</option></select>
      </div>
    </div>
    <div class="wa-modal-foot">
      <button class="wa-btn wa-btn-ghost" onclick="document.getElementById('waCampModal').style.display='none'">Cancel</button>
      <button class="wa-btn wa-btn-primary" id="waCampSubmitBtn" onclick="submitCampaign()">Preview &amp; Send</button>
    </div>
  </div>
</div>

<script src="../../../assets/js/whatsapp/wa-nav.js"></script>
<script src="../../../assets/js/whatsapp/wa-ui.js"></script>
<script>
WA_UI.initTheme(); WA_NAV.render('campaigns');

const statusColor = { completed:'gray', running:'green', scheduled:'amber', draft:'gray', failed:'red', cancelled:'gray' };
const body = document.getElementById('waCampBody');

async function loadCampaigns() {
  try {
    const res = await API.getWhatsAppCampaigns();
    const campaigns = res.campaigns || res || [];
    if (!campaigns.length) {
      body.innerHTML = `<tr><td colspan="9" class="wa-muted">No campaigns yet. Create your first one.</td></tr>`;
      return;
    }
    body.innerHTML = campaigns.map(c => {
      const status = (c.status || 'draft').toLowerCase();
      return `
      <tr>
        <td class="wa-bold">${c.name || 'Untitled'}</td>
        <td class="wa-muted">${c.audienceLabel || c.audience || '—'}</td>
        <td>${(c.sent || 0).toLocaleString()}</td>
        <td>${(c.delivered || 0).toLocaleString()}</td>
        <td>${(c.read || 0).toLocaleString()}</td>
        <td>${(c.replied || 0).toLocaleString()}</td>
        <td>${(c.converted || 0).toLocaleString()}</td>
        <td><span class="wa-badge ${statusColor[status] || 'gray'}">${c.status || 'Draft'}</span></td>
        <td>
          ${status === 'scheduled' || status === 'draft' ? `<button class="wa-btn wa-btn-ghost wa-btn-sm" onclick="startCampaign('${c._id || c.id}')">Start</button>` : ''}
          ${status === 'running' || status === 'scheduled' ? `<button class="wa-btn wa-btn-ghost wa-btn-sm" onclick="cancelCampaign('${c._id || c.id}')">Cancel</button>` : ''}
        </td>
      </tr>`;
    }).join('');
  } catch (e) {
    body.innerHTML = `<tr><td colspan="9" class="wa-muted">Could not load campaigns: ${e.message}</td></tr>`;
  }
}

async function startCampaign(id) {
  try { await API.startWhatsAppCampaign(id); WA_UI.toast('Campaign started', 'success'); loadCampaigns(); }
  catch (e) { WA_UI.toast(e.message || 'Could not start campaign', 'error'); }
}
async function cancelCampaign(id) {
  try { await API.cancelWhatsAppCampaign(id); WA_UI.toast('Campaign cancelled', 'success'); loadCampaigns(); }
  catch (e) { WA_UI.toast(e.message || 'Could not cancel campaign', 'error'); }
}

async function openCampModal() {
  document.getElementById('waCampModal').style.display = 'flex';
  const tplSel = document.getElementById('waCampTemplate');
  try {
    const res = await API.getWhatsAppTemplates();
    const templates = (res.templates || []).filter(t => t.status === 'approved');
    tplSel.innerHTML = templates.length
      ? templates.map(t => `<option value="${t.templateName || t.name}">${t.templateName || t.name}</option>`).join('')
      : `<option value="">No approved templates</option>`;
  } catch (e) {
    tplSel.innerHTML = `<option value="">Could not load templates</option>`;
  }
}

async function submitCampaign() {
  const name     = document.getElementById('waCampName').value.trim();
  const audience = document.getElementById('waCampAudience').value;
  const template = document.getElementById('waCampTemplate').value;
  const schedule = document.getElementById('waCampSchedule').value;
  if (!name)     return WA_UI.toast('Campaign name is required', 'error');
  if (!template) return WA_UI.toast('Choose a template', 'error');

  const btn = document.getElementById('waCampSubmitBtn');
  btn.disabled = true;
  try {
    await API.createWhatsAppCampaign({ name, audience, template, schedule });
    WA_UI.toast('Campaign created', 'success');
    document.getElementById('waCampModal').style.display = 'none';
    loadCampaigns();
  } catch (e) {
    WA_UI.toast(e.message || 'Could not create campaign', 'error');
  } finally {
    btn.disabled = false;
  }
}

loadCampaigns();
</script>
</body>
</html>
