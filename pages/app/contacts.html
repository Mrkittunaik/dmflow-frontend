<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167x167.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120x120.png">
  <link rel="manifest" href="/icons/site.webmanifest">
  <meta name="msapplication-TileImage" content="/icons/mstile-150x150.png">
  <meta name="msapplication-TileColor" content="#0A0A0F">
  <meta name="msapplication-config" content="/icons/browserconfig.xml">
  <meta name="theme-color" content="#0A0A0F">
<meta name="dmflow-api" content="https://dmflow-backend-u9h8.onrender.com">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Contacts – DMFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Instrument Sans',sans-serif;background-color:#fce7f3;background-image:radial-gradient(circle,#f9a8d4 1px,transparent 1px);background-size:20px 20px;color:#0A0A0F;-webkit-font-smoothing:antialiased;}
.main{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff;border-bottom:1px solid #E2E2EA;flex-shrink:0;gap:12px;}
.topbar-title{font-family:'Bricolage Grotesque',sans-serif;font-size:16px;font-weight:800;}
.topbar-actions{display:flex;align-items:center;gap:8px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .2s;}
.btn-outline{background:#fff;border:1.5px solid #E2E2EA;color:#0A0A0F;}
.btn-outline:hover{border-color:#0A0A0F;}
.btn-primary{background:#0A0A0F;color:#fff;}
.btn-primary:hover{background:#2A2A3A;}
.search-bar{display:flex;align-items:center;gap:8px;padding:10px 24px;background:#fff;border-bottom:1px solid #E2E2EA;flex-shrink:0;}
.search-input{flex:1;padding:8px 12px;border:1.5px solid #E2E2EA;border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#F8F8FC;}
.search-input:focus{border-color:#7C3AED;background:#fff;}
.scroll{flex:1;overflow-y:auto;padding:20px 24px;}
.scroll::-webkit-scrollbar{width:4px;}
.scroll::-webkit-scrollbar-thumb{background:#E2E2EA;border-radius:2px;}
.empty-state{text-align:center;padding:60px 20px;color:#9898A8;}
.empty-state svg{margin:0 auto 12px;display:block;opacity:.4;}
.empty-state h3{font-size:15px;font-weight:700;color:#0A0A0F;margin-bottom:6px;}
.empty-state p{font-size:13px;color:#9898A8;}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;border:1px solid #E2E2EA;}
thead{background:#F8F8FC;}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:700;color:#9898A8;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #E2E2EA;}
td{padding:12px 16px;font-size:13px;border-bottom:1px solid #F4F4F8;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#FAFAFE;}
.av{width:32px;height:32px;border-radius:50%;background:#7C3AED;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.contact-name{font-weight:600;color:#0A0A0F;}
.contact-handle{font-size:11px;color:#9898A8;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;}
.badge-email{background:#DCFCE7;color:#166534;}
.badge-kw{background:#EEF2FF;color:#4338CA;}
.del-btn{background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:6px;color:#9898A8;transition:all .2s;}
.del-btn:hover{background:#FEE2E2;color:#EF4444;}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 0;margin-top:12px;}
.page-info{font-size:12px;color:#9898A8;}
.page-btns{display:flex;gap:6px;}
.page-btn{padding:5px 12px;border:1.5px solid #E2E2EA;border-radius:7px;background:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;}
.page-btn:hover:not(:disabled){border-color:#0A0A0F;}
.page-btn:disabled{opacity:.4;cursor:not-allowed;}
.loading-row td{text-align:center;padding:40px;color:#9898A8;font-size:13px;}
@media(max-width:600px){
  .topbar{padding:10px 14px;}
  .search-bar{padding:8px 14px;}
  .scroll{padding:12px 14px 80px;}
  th,td{padding:9px 10px;font-size:12px;}
  .topbar-title{font-size:14px;}
  .btn{padding:6px 10px;font-size:11px;}
  table{border-radius:10px;}
  /* Hide less important columns on mobile */
  th:nth-child(3),td:nth-child(3),th:nth-child(4),td:nth-child(4){display:none;}
}
</style>
</head>
<body>
<div class="main">
  <div class="topbar">
    <div class="topbar-title">Contacts</div>
    <div class="topbar-actions">
      <button class="btn btn-outline" onclick="exportContacts()">
        <svg width="13" height="13" fill="none" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polyline points="7 10 12 15 17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Export CSV
      </button>
    </div>
  </div>
  <div class="search-bar">
    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" style="color:#9898A8;flex-shrink:0;"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="1.8"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input class="search-input" type="text" placeholder="Search by name, username or email…" id="searchInput" oninput="onSearch(this.value)">
    <span id="totalCount" style="font-size:12px;color:#9898A8;flex-shrink:0;"></span>
  </div>
  <div class="scroll">
    <div id="contactsWrap">
      <table id="contactsTable">
        <thead>
          <tr>
            <th>Contact</th>
            <th>Email</th>
            <th>Source</th>
            <th>DMs Sent</th>
            <th>Added</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="contactsTbody">
          <tr class="loading-row"><td colspan="6">Loading contacts…</td></tr>
        </tbody>
      </table>
      <div class="pagination">
        <span class="page-info" id="pageInfo"></span>
        <div class="page-btns">
          <button class="page-btn" id="prevBtn" onclick="changePage(-1)" disabled>← Prev</button>
          <button class="page-btn" id="nextBtn" onclick="changePage(1)" disabled>Next →</button>
        </div>
      </div>
    </div>
    <div id="emptyState" class="empty-state" style="display:none;">
      <svg width="48" height="48" fill="none" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke="#C0C0CC" stroke-width="1.5" stroke-linecap="round"/><circle cx="9" cy="7" r="4" stroke="#C0C0CC" stroke-width="1.5"/><path d="M23 21v-2a4 4 0 00-3-3.87" stroke="#C0C0CC" stroke-width="1.5" stroke-linecap="round"/><path d="M16 3.13a4 4 0 010 7.75" stroke="#C0C0CC" stroke-width="1.5" stroke-linecap="round"/></svg>
      <h3>No contacts yet</h3>
      <p>Contacts appear here when your automations collect emails or interact with followers.</p>
    </div>
  </div>
</div>

<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/api.js"></script>
<script>
(function() {
  const user = JSON.parse(localStorage.getItem('dmflow_user') || 'null');
  if (!user) { if (window !== window.top) { window.top.location.href = 'pages/auth/login.html'; } else { window.location.href = '../auth/login.html'; }; return; }
})();

let currentPage = 1;
let totalPages  = 1;
let totalCount  = 0;
let searchVal   = '';
let searchTimer = null;

function onSearch(val) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchVal   = val.trim();
    currentPage = 1;
    loadContacts();
  }, 400);
}

function changePage(dir) {
  currentPage = Math.max(1, Math.min(totalPages, currentPage + dir));
  loadContacts();
}

async function loadContacts() {
  const tbody = document.getElementById('contactsTbody');
  tbody.innerHTML = '<tr class="loading-row"><td colspan="6">Loading…</td></tr>';

  if (!window.API || !API.getToken()) {
    showEmpty();
    return;
  }

  try {
    const res = await API.getContacts(currentPage, searchVal);
    const contacts = res.contacts || [];
    totalPages  = res.pages  || 1;
    totalCount  = res.total  || 0;
    currentPage = res.page   || 1;

    document.getElementById('totalCount').textContent = totalCount + ' contact' + (totalCount !== 1 ? 's' : '');

    if (!contacts.length) {
      showEmpty();
      return;
    }

    document.getElementById('emptyState').style.display   = 'none';
    document.getElementById('contactsWrap').style.display = '';

    tbody.innerHTML = contacts.map(c => {
      const initials = (c.name || c.username || '?')[0].toUpperCase();
      const name     = c.name || c.username || '—';
      const handle   = c.username ? '@' + c.username : '';
      const email    = c.email || '—';
      const source   = c.source || 'automation';
      const dms      = c.dmCount || 0;
      const date     = c.createdAt ? new Date(c.createdAt).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '—';
      const sourceLabel = source === 'email_collect' ? '<span class="badge badge-email">Email Collect</span>' : '<span class="badge badge-kw">Automation</span>';
      return `<tr>
        <td><div style="display:flex;align-items:center;gap:10px;">
          <div class="av">${initials}</div>
          <div><div class="contact-name">${escHtml(name)}</div><div class="contact-handle">${escHtml(handle)}</div></div>
        </div></td>
        <td style="color:${c.email?'#0A0A0F':'#C0C0CC'}">${escHtml(email)}</td>
        <td>${sourceLabel}</td>
        <td style="font-weight:700;">${dms}</td>
        <td style="color:#9898A8;">${date}</td>
        <td><button class="del-btn" title="Delete" onclick="deleteContact('${c._id}',this)">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button></td>
      </tr>`;
    }).join('');

    document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
    document.getElementById('prevBtn').disabled = currentPage <= 1;
    document.getElementById('nextBtn').disabled = currentPage >= totalPages;

  } catch(e) {
    tbody.innerHTML = '<tr class="loading-row"><td colspan="6">Could not load contacts. ' + (e.message||'') + '</td></tr>';
  }
}

function showEmpty() {
  document.getElementById('contactsWrap').style.display = 'none';
  document.getElementById('emptyState').style.display   = '';
  document.getElementById('totalCount').textContent = '0 contacts';
}

async function deleteContact(id, btn) {
  if (!confirm('Delete this contact?')) return;
  const row = btn.closest('tr');
  row.style.opacity = '0.4';
  try {
    await API.deleteContact(id);
    row.remove();
    totalCount = Math.max(0, totalCount - 1);
    document.getElementById('totalCount').textContent = totalCount + ' contact' + (totalCount !== 1 ? 's' : '');
    if (document.querySelectorAll('#contactsTbody tr').length === 0) loadContacts();
  } catch(e) {
    row.style.opacity = '1';
    alert('Could not delete: ' + e.message);
  }
}

async function exportContacts() {
  if (!window.API || !API.getToken()) return;
  try {
    const baseUrl = API.BASE_URL;
    const res = await fetch(baseUrl + '/api/contacts/export', {
      headers: { Authorization: 'Bearer ' + API.getToken() }
    });
    if (!res.ok) throw new Error('Export failed');
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'dmflow-contacts.csv'; a.click();
    URL.revokeObjectURL(url);
  } catch(e) {
    alert('Export failed: ' + e.message);
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadContacts();
</script>

<!-- PRO LOCK OVERLAY -->
<div id="proLockOverlay" style="display:none;position:fixed;inset:0;z-index:9998;background:rgba(248,248,252,.92);backdrop-filter:blur(8px);align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;">
  <div style="background:#fff;border-radius:22px;padding:36px 32px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.12);">
    <div style="width:56px;height:56px;background:linear-gradient(135deg,#7C3AED,#5B21B6);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
      <svg width="26" height="26" fill="none" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 11V7a5 5 0 0110 0v4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div id="proLockTitle" style="font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:800;color:#0A0A0F;margin-bottom:8px;">Pro Feature</div>
    <div id="proLockSub" style="font-size:13px;color:#5A5A6E;margin-bottom:24px;line-height:1.5;">Upgrade to DMFlow Pro to access this feature and manage your contacts, templates, and keywords.</div>
    <button onclick="triggerUpgrade()" style="width:100%;padding:13px;background:linear-gradient(135deg,#7C3AED,#5B21B6);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;margin-bottom:8px;">✦ Upgrade to Pro</button>
    <button onclick="goBack()" style="width:100%;padding:10px;background:none;border:1.5px solid #E2E2EA;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:#5A5A6E;">← Go Back</button>
  </div>
</div>
<script>
(function() {
  const user = JSON.parse(localStorage.getItem('dmflow_user') || 'null');
  const plan = (user && (user.plan || '')).toLowerCase();
  if (!user || !plan || plan === 'free') {
    const overlay = document.getElementById('proLockOverlay');
    if (overlay) { overlay.style.display = 'flex'; }
  }
  window.triggerUpgrade = function() {
    if (window.parent && window.parent !== window) {
      try { window.parent.openUpgradeModal(); return; } catch(e) {}
      window.parent.postMessage({ type: 'dmflow_upgrade' }, '*');
    } else {
      window.location.href = '../../app.html?upgrade=1';
    }
  };
  window.goBack = function() {
    if (window.parent && window.parent !== window && window.parent.navigate) {
      window.parent.navigate('pages/app/dashboard.html', 'dashboard');
    } else {
      history.back();
    }
  };
})();
</script>

</body>
</html>
