<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="dmflow-api" content="">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Inbox – DMFlow</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Instrument Sans',sans-serif;background:#F4F4F8;color:#0A0A0F;-webkit-font-smoothing:antialiased;}
.main{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff;border-bottom:1px solid #E2E2EA;flex-shrink:0;}
.topbar-title{font-family:'Bricolage Grotesque',sans-serif;font-size:16px;font-weight:800;}
.search-bar{padding:10px 24px;background:#fff;border-bottom:1px solid #E2E2EA;flex-shrink:0;}
.search-input{width:100%;padding:8px 12px;border:1.5px solid #E2E2EA;border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#F8F8FC;}
.search-input:focus{border-color:#7C3AED;background:#fff;}
.inbox-layout{display:grid;grid-template-columns:320px 1fr;flex:1;overflow:hidden;min-height:0;}
.thread-list{border-right:1px solid #E2E2EA;overflow-y:auto;background:#fff;}
.thread-list::-webkit-scrollbar{width:3px;}
.thread-list::-webkit-scrollbar-thumb{background:#E2E2EA;border-radius:2px;}
.thread-item{padding:14px 18px;border-bottom:1px solid #F4F4F8;cursor:pointer;transition:background .15s;display:flex;gap:12px;align-items:flex-start;}
.thread-item:hover{background:#F8F8FC;}
.thread-item.active{background:#F4F0FF;}
.thread-item.unread .thread-name{font-weight:800;}
.t-av{width:36px;height:36px;border-radius:50%;background:#7C3AED;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
.thread-body{flex:1;min-width:0;}
.thread-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px;}
.thread-name{font-size:13px;font-weight:600;color:#0A0A0F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.thread-time{font-size:11px;color:#9898A8;flex-shrink:0;}
.thread-preview{font-size:12px;color:#9898A8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.unread-dot{width:8px;height:8px;border-radius:50%;background:#7C3AED;flex-shrink:0;margin-top:4px;}
.chat-panel{display:flex;flex-direction:column;overflow:hidden;background:#F8F8FC;}
.chat-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#9898A8;}
.chat-empty svg{opacity:.3;}
.chat-header{padding:14px 20px;background:#fff;border-bottom:1px solid #E2E2EA;flex-shrink:0;display:flex;align-items:center;gap:12px;}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;}
.chat-messages::-webkit-scrollbar{width:3px;}
.chat-messages::-webkit-scrollbar-thumb{background:#E2E2EA;border-radius:2px;}
.msg-bubble{max-width:70%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.5;}
.msg-bubble.them{background:#fff;border:1px solid #E2E2EA;border-radius:14px 14px 14px 4px;align-self:flex-start;}
.msg-bubble.us{background:#7C3AED;color:#fff;border-radius:14px 14px 4px 14px;align-self:flex-end;}
.msg-time{font-size:10px;color:#9898A8;margin-top:3px;}
.msg-wrap{display:flex;flex-direction:column;}
.msg-wrap.us{align-items:flex-end;}
.chat-input-row{padding:12px 20px;background:#fff;border-top:1px solid #E2E2EA;display:flex;gap:10px;align-items:flex-end;flex-shrink:0;}
.chat-textarea{flex:1;padding:10px 14px;border:1.5px solid #E2E2EA;border-radius:10px;font-size:13px;font-family:inherit;outline:none;resize:none;max-height:100px;line-height:1.5;}
.chat-textarea:focus{border-color:#7C3AED;}
.send-btn{padding:10px 18px;background:#7C3AED;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .2s;flex-shrink:0;}
.send-btn:hover{background:#6D28D9;}
.send-btn:disabled{opacity:.5;cursor:not-allowed;}
.empty-state{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:40px;color:#9898A8;}
.empty-state svg{opacity:.3;}
.empty-state h3{font-size:15px;font-weight:700;color:#0A0A0F;}
.empty-state p{font-size:13px;}
.note-banner{background:#FEF9C3;border:1px solid #FDE68A;border-radius:8px;padding:8px 14px;font-size:12px;color:#92400E;margin:12px 20px 0;flex-shrink:0;}
@media(max-width:700px){.inbox-layout{grid-template-columns:1fr;}.chat-panel{display:none;}.inbox-layout.chat-open .thread-list{display:none;}.inbox-layout.chat-open .chat-panel{display:flex;}}
@media(max-width:600px){
  .topbar{padding:10px 14px;}
  .topbar-title{font-size:14px;}
  .search-bar{padding:8px 14px;}
  .thread-item{padding:11px 14px;}
  .thread-name{font-size:12px;}
  .thread-preview{font-size:11px;}
  .t-av{width:32px;height:32px;font-size:12px;}
  .msg-bubble{font-size:12px;padding:8px 12px;}
  .chat-header{padding:10px 14px;}
  .chat-input-row{padding:8px 14px;}
  .note-banner{font-size:11px;padding:6px 12px;margin:8px 14px 0;}
}
</style>
</head>
<body>
<div class="main">
  <div class="topbar">
    <div class="topbar-title">Inbox</div>
  </div>
  <div class="search-bar">
    <input class="search-input" type="text" placeholder="Search conversations…" id="searchInput" oninput="onSearch(this.value)">
  </div>
  <div class="inbox-layout" id="inboxLayout">
    <!-- Thread list -->
    <div class="thread-list" id="threadList">
      <div style="text-align:center;padding:40px 20px;color:#9898A8;font-size:13px;">Loading…</div>
    </div>
    <!-- Chat panel -->
    <div class="chat-panel" id="chatPanel">
      <div class="chat-empty">
        <svg width="48" height="48" fill="none" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="#C0C0CC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div style="font-size:13px;">Select a conversation to read</div>
      </div>
    </div>
  </div>
</div>

<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/api.js"></script>
<script>
(function() {
  const user = JSON.parse(localStorage.getItem('dmflow_user') || 'null');
  if (!user) { if (window !== window.top) { window.top.location.href = 'pages/auth/login.html'; } else { window.location.href = '../auth/login.html'; }; return; }
})();

let activeThreadId = null;
let searchTimer    = null;
let searchVal      = '';

function onSearch(val) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { searchVal = val.trim(); loadThreads(); }, 400);
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(dateStr) {
  if (!dateStr) return '';
  const diff = Date.now() - new Date(dateStr).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1)  return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}

async function loadThreads() {
  const list = document.getElementById('threadList');
  list.innerHTML = '<div style="text-align:center;padding:40px 20px;color:#9898A8;font-size:13px;">Loading…</div>';

  if (!window.API || !API.getToken()) {
    list.innerHTML = '<div style="text-align:center;padding:40px 20px;color:#9898A8;font-size:13px;">Not logged in.</div>';
    return;
  }

  try {
    const res     = await API.getInbox(1, searchVal);
    const threads = res.threads || [];

    if (!threads.length) {
      list.innerHTML = `<div style="text-align:center;padding:50px 20px;">
        <svg width="40" height="40" fill="none" viewBox="0 0 24 24" style="margin:0 auto 10px;display:block;opacity:.3;"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="#9898A8" stroke-width="1.5" stroke-linecap="round"/></svg>
        <div style="font-size:13px;font-weight:600;color:#9898A8;">No conversations yet</div>
        <div style="font-size:12px;color:#C0C0CC;margin-top:4px;">Conversations from your automations will appear here.</div>
      </div>`;
      return;
    }

    list.innerHTML = threads.map(t => {
      const initials = (t.username || t.name || '?')[0].toUpperCase();
      const name     = t.name || ('@' + (t.username || 'unknown'));
      const preview  = t.lastMessage || '—';
      const isUnread = t.unread;
      return `<div class="thread-item${isUnread?' unread':''}" id="ti-${t._id}" onclick="openThread('${t._id}','${escHtml(name)}','${initials}')">
        <div class="t-av" style="background:${stringColor(t.username||t._id)}">${initials}</div>
        <div class="thread-body">
          <div class="thread-top">
            <span class="thread-name">${escHtml(name)}</span>
            <span class="thread-time">${timeAgo(t.lastAt)}</span>
          </div>
          <div class="thread-preview">${escHtml(preview)}</div>
        </div>
        ${isUnread ? '<div class="unread-dot"></div>' : ''}
      </div>`;
    }).join('');

  } catch(e) {
    list.innerHTML = '<div style="text-align:center;padding:30px;color:#EF4444;font-size:13px;">Error: ' + escHtml(e.message) + '</div>';
  }
}

function stringColor(s) {
  const colors = ['#7C3AED','#E1306C','#0EA5E9','#22C55E','#F59E0B','#EF4444'];
  let h = 0;
  for (let i = 0; i < (s||'').length; i++) h = s.charCodeAt(i) + ((h << 5) - h);
  return colors[Math.abs(h) % colors.length];
}

async function openThread(id, name, initials) {
  activeThreadId = id;

  // Mark active in list
  document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
  const ti = document.getElementById('ti-' + id);
  if (ti) { ti.classList.add('active'); ti.classList.remove('unread'); const dot = ti.querySelector('.unread-dot'); if(dot) dot.remove(); }

  // Mark read silently
  try { if(window.API && API.getToken()) await API.markRead(id); } catch(e) {}

  const panel = document.getElementById('chatPanel');
  panel.innerHTML = `
    <div class="note-banner">⚠️ Replies are saved to DMFlow. Actual Instagram delivery requires webhook integration.</div>
    <div class="chat-header">
      <div class="t-av" style="background:${stringColor(name)}">${initials}</div>
      <div>
        <div style="font-size:14px;font-weight:700;">${escHtml(name)}</div>
        <div style="font-size:11px;color:#9898A8;">Instagram DM</div>
      </div>
    </div>
    <div class="chat-messages" id="chatMessages"><div style="text-align:center;padding:30px;color:#9898A8;font-size:13px;">Loading messages…</div></div>
    <div class="chat-input-row">
      <textarea class="chat-textarea" id="replyInput" placeholder="Type a reply…" rows="1" onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendReply()">Send</button>
    </div>`;

  // Load thread messages
  try {
    const thread = await API.getThread(id);
    const msgs   = thread.messages || [];
    const msgsEl = document.getElementById('chatMessages');
    if (!msgs.length) {
      msgsEl.innerHTML = '<div style="text-align:center;padding:30px;color:#9898A8;font-size:13px;">No messages in this thread.</div>';
      return;
    }
    msgsEl.innerHTML = msgs.map(m => {
      const isUs = m.from === 'user';
      const t    = m.sentAt ? new Date(m.sentAt).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}) : '';
      return `<div class="msg-wrap${isUs?' us':''}">
        <div class="msg-bubble${isUs?' us':' them'}">${escHtml(m.text)}</div>
        <div class="msg-time">${t}</div>
      </div>`;
    }).join('');
    msgsEl.scrollTop = msgsEl.scrollHeight;
  } catch(e) {
    const msgsEl = document.getElementById('chatMessages');
    if (msgsEl) msgsEl.innerHTML = '<div style="text-align:center;padding:30px;color:#EF4444;font-size:13px;">Could not load messages.</div>';
  }
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); }
}

async function sendReply() {
  if (!activeThreadId) return;
  const input = document.getElementById('replyInput');
  const btn   = document.getElementById('sendBtn');
  const text  = input ? input.value.trim() : '';
  if (!text) return;

  input.value   = '';
  btn.disabled  = true;

  // Add optimistically
  const msgsEl = document.getElementById('chatMessages');
  const now    = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  if (msgsEl) {
    msgsEl.insertAdjacentHTML('beforeend', `<div class="msg-wrap us"><div class="msg-bubble us">${escHtml(text)}</div><div class="msg-time">${now}</div></div>`);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  try {
    if (window.API && API.getToken()) await API.sendReply(activeThreadId, text);
  } catch(e) {
    // silent — message still shows optimistically
  } finally {
    if (btn) btn.disabled = false;
  }
}

loadThreads();
</script>
</body>
</html>
